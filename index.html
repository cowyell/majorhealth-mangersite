    sortRows(srows, 'sched.main').forEach(function (r) {
      body += '<tr><td><div class="who"><span class="nm">' + esc(r.name) + '</span><span class="cd">' + esc(r.code) + '</span></div></td>' +
        '<td class="n">' + num(r.g1) + '</td><td class="n">' + num(r.g2) + '</td><td class="n"><b>' + num(r.cnt) + '</b></td>' +
        '<td class="n">' + num(r.r1) + '</td><td class="n">' + num(r.r2) + '</td><td class="n">' + num(r.radd) + '</td><td class="n"><b>' + num(r.rtot) + '</b></td>' +
        '<td class="n">' + num(r.paid) + '</td>' +
        '<td class="n"><div class="bar-wrap"><span class="pc">' + pct0(r.attRate) + '</span><div class="bar"><i class="' + (r.attRate >= 0.8 ? '' : 'warn') + '" style="width:' + Math.min(100, r.attRate * 100) + '%"></i></div></div></td></tr>';
    });
    body += '</tbody><tfoot><tr><td>合計（全公司）</td><td class="n">' + num(A.total[0]) + '</td><td class="n">' + num(A.total[1]) + '</td><td class="n">' + num(A.total[2]) + '</td>' +
      '<td class="n">' + num(A.total[3]) + '</td><td class="n">' + num(A.total[4]) + '</td><td class="n">' + num(A.total[5]) + '</td><td class="n">' + num(A.total[6]) + '</td>' +
      '<td class="n">' + num(B ? B.total[2] : 0) + '</td><td class="n">' + pct0(A.total[2] && C ? C.total[2] / A.total[2] : 0) + '</td></tr></tfoot></table></div>';
    CSV_EXPORTS['sched.main'] = function () {
      return csvOf(['業務','代碼','一代檢次','二代檢次','檢次合計','營收一代','營收二代','營收加選','營收合計','已繳費','到檢率'],
        srows.map(function (r) { return [r.name, r.code, r.g1, r.g2, r.cnt, r.r1, r.r2, r.radd, r.rtot, r.paid, Math.round(r.attRate * 100) + '%']; }));
    };
    h += panelPad('預約檢次與營收（已預約統計表 · ' + mo + '）', body, csvBtn('sched.main'));
  } else h += panelPad('預約檢次與營收', emptyBox('這個月沒有已預約統計表', '拖入「已預約資料統計表-生技客服」。'));

  // 每日檢日分佈（明細）
  const rows = detailRows();
  if (rows.length) {
    const byDate = {};
    rows.forEach(function (r) {
      const d = r[C.d]; if (!d) return;
      if (!byDate[d]) byDate[d] = { att:0, not:0, amt:0 };
      if (r[C.att]) byDate[d].att += 1; else byDate[d].not += 1;
      byDate[d].amt += r[C.amt];
    });
    const dates = Object.keys(byDate).sort();
    const items = dates.map(function (d) {
      const o = byDate[d];
      return { label: mdy(d), sub: (o.att + o.not) + '人', segs: [
        { v:o.att, cls:'brand', title:d + ' 已到 ' + o.att },
        { v:o.not, cls:'line-2', op:.85, title:d + ' 未到 ' + o.not }
      ] };
    });
    h += '<div class="stack" style="margin-top:12px">' + panel('每日檢日人數', mo + '（深色＝已到檢，淺色＝尚未到檢）',
      vbars(items, { height:160, col:22 }) + '<div class="legend"><span><i style="background:var(--brand)"></i>已到檢</span><span><i style="background:var(--line-2)"></i>尚未到檢</span></div>') + '</div>';

    // 梯次 / 卡維 / 分級 / 性別 / 年齡
    function breakdown(key, title, note) {
      const agg = {};
      rows.forEach(function (r) {
        let k;
        if (key === 'sex') k = r[C.sex] ? '男' : '女';
        else if (key === 'age') { const a = r[C.age]; k = a == null ? '未知' : a < 30 ? '未滿30' : a < 40 ? '30–39' : a < 50 ? '40–49' : a < 60 ? '50–59' : a < 70 ? '60–69' : '70以上'; }
        else if (key === 'over3') k = r[C.over3] ? '3年以上回檢' : '其他';
        else k = dict(key, r[C[key]]) || '（空）';
        if (!agg[k]) agg[k] = { n:0, ppl:0 };
        agg[k].n += 1; agg[k].ppl += (r[C.att] ? 1 : 0);
      });
      let list = Object.keys(agg).map(k => ({ k:k, n:agg[k].n, att:agg[k].ppl }));
      list.sort((a,b) => b.n - a.n);
      const tot = rows.length || 1;
      let body = '<table><thead><tr><th>' + esc(title) + '</th><th class="n">筆數</th><th class="n">占比</th><th class="n">已到檢</th></tr></thead><tbody>';
      list.slice(0, 12).forEach(function (x) {
        body += '<tr><td>' + esc(x.k) + '</td><td class="n">' + num(x.n) + '</td><td class="n">' + pc(x.n / tot) + '</td><td class="n">' + num(x.att) + '</td></tr>';
      });
      body += '</tbody></table>';
      return panelPad(title + (note ? ' · ' + note : ''), '<div class="scroll" style="max-height:250px">' + body + '</div>');
    }
    h += '<div class="split even" style="margin-top:12px">' +
      '<div class="stack">' + breakdown('cat','類別結構') + breakdown('tier','梯次分佈') + '</div>' +
      '<div class="stack">' + breakdown('card','卡維（維護人）') + breakdown('age','受檢者年齡') + '</div></div>';
    h += '<div class="split even" style="margin-top:12px"><div class="stack">' + breakdown('grade','分級') + '</div><div class="stack">' + breakdown('sex','性別') + '</div></div>';
  } else if (!monthMismatch()) {
    h += '<div class="stack" style="margin-top:12px">' + panelPad('明細分佈', emptyBox('沒有預約明細', '拖入「預約資料_全(週統計)」。')) + '</div>';
  }
  return h;
}

/* ============================ 排檢量警訊 ============================ */
function warnByDate() {
  // 把同一天的上下午兩列合併
  const W = (DB.D.warn && DB.D.warn.rows) || [];
  const map = {};
  W.forEach(function (r) {
    const cl = r[0], d = r[2];
    const key = cl + '|' + d;
    if (!map[key]) map[key] = { cl:cl, d:d, cap:0, quota:0, open:0, extra:0, bk:0, paid:0, unp:0, hold:0, mem:0, corp:0, dy:0 };
    const o = map[key];
    o.cap += r[4]; o.quota += r[6]; o.open += r[7]; o.extra += r[8];
    o.bk += r[11]; o.paid += r[13]; o.unp += r[15]; o.hold += r[10];
    o.mem += r[18]; o.corp += r[25]; o.dy += r[9];
  });
  return Object.keys(map).map(k => map[k]).sort((a,b) => a.d < b.d ? -1 : a.d > b.d ? 1 : (a.cl < b.cl ? -1 : 1));
}

    let dts = order.filter(d => d.replace(/\(.*/, '').replace(/\//g, '-') >= today).slice(0, 21);
    if (DB.sort['warn.d97'].dir < 0) dts = dts.slice().reverse();

      '<button class="thb" data-sort="warn.d97|date">日期<span class="ar">' + (DB.sort['warn.d97'].dir < 0 ? '▾' : '▴') + '</span></button></th>' +
      '<th>樓層</th>' +
      '<th class="n">總額</th><th class="n">已約</th><th class="n">名額外</th><th class="n">空額</th>' +
      '<th class="n">已付</th><th class="n">未付</th><th class="n">女</th><th class="n">男</th>' +
      '<th class="n">個檢</th><th class="n">企檢</th><th class="n">通路</th></tr></thead><tbody>';
    dts.forEach(function (d) {
      const list = byDate[d];
      list.forEach(function (r, i) {
        const isTot = r[1] === '總計';
        const extra = r[3] - r[2];   // 已約 − 總額 = 名額外
        body += '<tr' + (isTot ? ' style="background:var(--surface-2);font-weight:600"' : '') + '>' +
          (i === 0 ? '<td rowspan="' + list.length + '" style="vertical-align:top;white-space:nowrap"><b>' + esc(r[0].replace(/\(.*/, '')) + '</b>' +
            '<div style="color:var(--ink-3);font-weight:400;font-size:11px">' + esc((r[0].match(/\((.*)\)/) || ['', ''])[1]) + '</div></td>' : '') +
          '<td>' + FL(r[1]) + '</td>' +
          '<td class="n">' + num(r[2]) + '</td>' +
          '<td class="n">' + num(r[3]) + '</td>' +
          '<td class="n"' + (extra > 0 ? ' style="color:var(--amber);font-weight:600"' : '') + '>' + (extra > 0 ? num(extra) : '—') + '</td>' +
          '<td class="n">' + num(r[4]) + '</td>' +
          '<td class="n">' + num(r[5]) + '</td>' +
          '<td class="n">' + num(r[6]) + '</td>' +
          '<td class="n">' + num(r[7]) + '</td>' +
          '<td class="n">' + num(r[8]) + '</td>' +
          '<td class="n">' + num(r[9]) + '</td>' +
          '<td class="n">' + num(r[12]) + '</td>' +
          '<td class="n">' + num(r[14]) + '</td></tr>';
      });
    });
    body += '</tbody></table></div>';
    h += '<div class="stack" style="margin-top:12px">' + panelPad('97 診 6F / 7F / 7F外 — 名額外狀況（今天起 21 天）',
      (dts.length ? body : emptyBox('沒有今天之後的日期', '這份名額外狀況表的區間已經過了。')) +
      '<div class="legend" style="margin-top:8px"><span><b>名額外</b> ＝ 已約 − 總額（超出實開名額的部分）</span><span>個檢／企檢／通路 ＝ 各來源已約人數</span></div>') + '</div>';
  }
  return h;
}

<script>
/* ============================================================================
   EXPORT / SYNC
   1) 匯出更新後的 HTML：把目前資料重新烤進檔案，丟上網站就等於發布新資料
      （零後端；朋友只要重新整理網頁就看到最新數字）
   2) 雲端同步（選配）：Supabase + 端到端加密。每次匯入上傳一份快照，
      所有裝置自動抓最新的一份。設計成「只新增、不覆蓋」，所以多個人匯入也不會弄丟資料。
   ============================================================================ */

/* ---------- 保留一份「還沒被畫過」的原始文件，匯出時拿它來改 ---------- */
var PRISTINE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

const SYNC_SQL = [
  '-- 在 Supabase 的 SQL Editor 貼上整段，然後按右下角的 Run',
  'create table if not exists paijian_sync (',
  '  id uuid primary key default gen_random_uuid(),',
  '  created_at timestamptz not null default now(),',
  '  room text not null,',
  '  label text,',
  '  n int,',
  '  payload text not null',
  ');',
  'alter table paijian_sync enable row level security;',
  '',
  '-- 資料本身已加密，所以開放 anon 讀寫；room 由密語推導，猜不到別人的房間',
  'drop policy if exists pj_read on paijian_sync;',
  'drop policy if exists pj_write on paijian_sync;',
  'drop policy if exists pj_del on paijian_sync;',
  'create policy pj_read  on paijian_sync for select to anon, authenticated using (true);',
  'create policy pj_write on paijian_sync for insert to anon, authenticated with check (true);',
  'create policy pj_del   on paijian_sync for delete to anon, authenticated using (true);',
  '',
  '-- 沒有這段，前端會拿到 permission denied for table paijian_sync',
  'grant usage on schema public to anon, authenticated;',
  'grant select, insert, delete on table paijian_sync to anon, authenticated;',
  '',
  'create index if not exists paijian_sync_room_time on paijian_sync (room, created_at desc);'
].join('\n');

const SYNC = {
  url: '', key: '', pass: '', label: '', auto: true,
  room: '', status: 'off', msg: '', lastAt: 0, lastFrom: '', busy: false,
};

/* ---------- base64 / 壓縮 ---------- */
function u8ToB64(u8) {
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}
function b64ToU8(b) {
  const bin = atob(b); const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function deflateStr(str) {
  const st = new Blob([new TextEncoder().encode(str)]).stream().pipeThrough(new CompressionStream('deflate'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
async function inflateToStr(u8) {
  const st = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate'));
  return await new Response(st).text();
}
function hasCrypto() { return typeof crypto !== 'undefined' && crypto.subtle && typeof CompressionStream !== 'undefined'; }

async function deriveKey(pass, room) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: enc.encode(room), iterations: 150000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function roomOf(pass) {
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('paijian|' + pass));
  return 'p' + Array.from(new Uint8Array(h)).slice(0, 12).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function encryptStr(key, str) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(str)));
  const out = new Uint8Array(12 + ct.length); out.set(iv, 0); out.set(ct, 12);
  return u8ToB64(out);
}
async function decryptStr(key, b64) {
  const u = b64ToU8(b64);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(0, 12) }, key, u.subarray(12));
  return new TextDecoder().decode(pt);
}

/* ---------- 匯出：把目前資料烤進一份新的 HTML ---------- */
async function payloadB64(D, prefs, syncCfg) {
  const clone = Object.assign({}, D);
  if (prefs) clone.prefs = prefs;
  // 只烤 url / key / 名稱，絕對不烤密語——anon key 本來就是公開的，
  // 沒有密語就推不出 room、也解不開密文，所以資料仍然安全。
  if (syncCfg) clone.sync = syncCfg;
  clone.generatedAt = fmtTS(Date.now());   // 本地時間，方便人看
  return u8ToB64(await deflateStr(JSON.stringify(clone)));
}
const BLANK_D = {
  generatedAt: '', statsTime: '', month: '', biz: [], detailCols: [], detail: [],
  dicts: { cat: [], unit: [], cl: [], proj: [], tier: [], card: [], grade: [] },
  recon: null, booked: null, warn: null, monthly: null
};
async function exportHtml(blank) {
  try {
    const D = blank ? BLANK_D : DB.D;
    const b64 = await payloadB64(D, blank ? null : { clinicName: DB.clinicName });
    const r = buildExport(await pristineSource(), b64);
    if (r.err) { toast('匯出中止：' + r.err, true); return; }
    download(new Blob([r.html], { type: 'text/html;charset=utf-8' }),
      '美兆排檢管理台' + (blank ? '_空白版' : '_' + (DB.D.month || '') + '_' + todayISO()) + '.html');
    toast(blank ? '已匯出空白版（' + Math.round(r.html.length / 1024) + ' KB）— 不含任何受檢者資料'
                : '已匯出 ' + Math.round(r.html.length / 1024) + ' KB，丟上網站就等於發布新資料');
  } catch (e) { toast('匯出失敗：' + e.message, true); }
}

/* 匯出時要拿「原始檔」來改。放在網站上時直接抓伺服器的原始檔最準；
   本機檔案（file://）抓不到才退回 DOM 序列化版本。 */
async function pristineSource() {
  try {
    if (typeof location !== 'undefined' && /^https?:/i.test(location.href)) {
      const r = await fetch(location.href.split('#')[0], { cache: 'no-store' });
      if (r.ok) {
        const t = await r.text();
        if (hasPayload(t)) return t;
      }
    }
  } catch (e) { }
  return PRISTINE_HTML;
}
/* 換完之後做基本健檢，寧可擋下來也不要匯出壞檔 */
/* 這個錨點故意拆開來組，避免程式碼自己也被比對到 */
function payloadRe() {
  const open = '<scr' + 'ipt id="payload" type="application/base64">';
  const close = '</scr' + 'ipt>';
  return new RegExp('(' + open.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')[\\s\\S]*?(' + close.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')');
}
function hasPayload(src) { return src.indexOf('<scr' + 'ipt id="payload" type="application/base64">') > 0; }
function buildExport(src, b64) {
  const re = payloadRe();
  if (!re.test(src)) return { err: '來源檔找不到內嵌資料區塊' };
  const out = src.replace(re, function (m, a, b) { return a + b64 + b; });
  const scripts = (src.match(/<script\b/g) || []).length;
  const scripts2 = (out.match(/<script\b/g) || []).length;
  const closes = (out.match(/<\/script>/g) || []).length;
  if (scripts2 !== scripts) return { err: '匯出後 script 標籤數不對（' + scripts + ' → ' + scripts2 + '）' };
  if (closes !== scripts) return { err: '匯出後 script 標籤沒有成對（' + scripts + ' vs ' + closes + '）' };
  if (!hasPayload(out)) return { err: '匯出後找不到資料區塊' };
  if (out.length < 100000) return { err: '匯出檔太小（' + out.length + ' 字元），可能不完整' };
  return { html: out };
}

/* 共用版：空白資料 ＋ 同步設定，公開網址上放這個版本最安全 */
async function exportHtmlShared() {
  if (!syncReady()) { toast('請先設定好雲端同步，再匯出共用版', true); return; }
  try {
    const b64 = await payloadB64(BLANK_D, null, { url: syncRoot(), key: SYNC.key, label: SYNC.label });
    const r = buildExport(await pristineSource(), b64);
    if (r.err) { toast('匯出中止：' + r.err, true); return; }
    download(new Blob([r.html], { type: 'text/html;charset=utf-8' }), '美兆排檢管理台_共用版.html');
    toast('已匯出共用版（' + Math.round(r.html.length / 1024) + ' KB）— 不含任何受檢者資料與密語');
  } catch (e) { toast('匯出失敗：' + e.message, true); }
}

/* ---------- 同步 ---------- */
async function syncInit() {
  const cfg = await Store.get('sync');
  if (cfg) Object.assign(SYNC, cfg);
  // 共用版會把 url / key 烤進檔案；若這台還沒輸入過密語，接手這些設定並提示輸入
  const baked = DB.D && DB.D.sync;
  if (baked && baked.url && baked.key) {
    if (!SYNC.url) SYNC.url = syncRoot(baked.url);
    if (!SYNC.key) SYNC.key = baked.key;
    if (!SYNC.label) SYNC.label = baked.label || '共用後台';
    if (!SYNC.pass) SYNC.needsPass = true;
  }
  SYNC.status = SYNC.needsPass ? 'needpass' : (syncReady() ? 'idle' : 'off');
}
function syncReady() { return !!(SYNC.url && SYNC.key && SYNC.pass); }
function syncConfigured() { return !!(SYNC.url && SYNC.key); }   // 有 url+key 但可能還沒輸入密語
/* Supabase 的 Data API 頁顯示的是 REST 端點（結尾帶 /rest/v1/），
   直接貼進來會變成 .../rest/v1/rest/v1/... 而 404。這裡統一清掉。 */
function syncRoot(u) {
  return String(u == null ? SYNC.url : u).trim()
    .replace(/\/+$/, '').replace(/\/rest\/v1$/i, '').replace(/\/+$/, '');
}
function syncUrl(path) { return syncRoot() + '/rest/v1/' + path; }

/* ---- 分享連結：把設定塞進網址的 # 後面（# 不會送到伺服器） ---- */
function b64UrlOf(str) { return u8ToB64(new TextEncoder().encode(str)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function strOfB64Url(s) {
  s = String(s).replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return new TextDecoder().decode(b64ToU8(s));
}
function shareLink() {
  if (!syncReady()) return '';
  const href = (typeof location !== 'undefined' && location) ? String(location.href || '') : '';
  const base = /^https?:/i.test(href) ? href.split('#')[0] : '';
  const payload = b64UrlOf(JSON.stringify({ u: syncRoot(), k: SYNC.key, p: SYNC.pass, l: SYNC.label }));
  return base ? base + '#s=' + payload : '';
}
/* 開頁時若有分享連結，就直接套用 */
async function syncFromHash() {
  if (typeof location === 'undefined' || !location) return false;
  const m = String(location.hash || '').match(/[#&]s=([A-Za-z0-9_\-]+)/);
  if (!m) return false;
  try {
    const j = JSON.parse(strOfB64Url(m[1]));
    if (!j.u || !j.k || !j.p) return false;
    SYNC.url = syncRoot(j.u); SYNC.key = j.k; SYNC.pass = j.p;
    SYNC.label = j.l || '分享連結';
    SYNC.auto = true;
    await Store.set('sync', { url: SYNC.url, key: SYNC.key, pass: SYNC.pass, label: SYNC.label, auto: true });
    SYNC.status = 'idle';
    try { if (typeof history !== 'undefined' && history.replaceState) history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
    return true;
  } catch (e) { return false; }
}

/* 查雲端這個房間目前有什麼：幾筆、最新一筆是誰傳的、能不能解開 */
async function syncInspect() {
  const out = { ok:false, rows:0, latest:null, canDecrypt:null, recs:null, err:'' };
  try {
    SYNC.room = await roomOf(SYNC.pass);
    const url = syncUrl('paijian_sync') + '?room=eq.' + encodeURIComponent(SYNC.room) +
      '&select=created_at,label,n,payload&order=created_at.desc&limit=1';
    const res = await fetch(url, { headers: syncHdr() });
    if (!res.ok) { out.err = 'HTTP ' + res.status + ' ' + (await res.text()).slice(0, 160); return out; }
    const rows = await res.json();
    out.ok = true; out.rows = rows.length;
    if (!rows.length) return out;
    const row = rows[0];
    out.latest = { at: fmtTS(row.created_at), label: row.label || '未命名', n: row.n };
    try {
      const key = await deriveKey(SYNC.pass, SYNC.room);
      const plain = await inflateToStr(b64ToU8(await decryptStr(key, row.payload)));
      const obj = JSON.parse(plain);
      out.canDecrypt = true;
      out.recs = obj && obj.detail ? obj.detail : (obj.data && obj.data.detail ? obj.data.detail.length : 0);
    } catch (e) { out.canDecrypt = false; }
    return out;
  } catch (e) { out.err = e.message; return out; }
}
function inspectHtml(ins) {
  if (!ins.ok) return '<div style="color:var(--red)">查不到雲端：' + esc(ins.err || '未知錯誤') + '</div>';
  if (!ins.rows) return '<div style="color:var(--amber)"><b>雲端這個房間是空的（0 筆）。</b><br>上傳的那台還沒成功把資料送上去 —— 請在那台上按「儲存並上傳」，看到「已同步」再回來。</div>';
  const l = ins.latest;
  let h = '<div><b>雲端有 ' + ins.rows + ' 筆。</b>最新一筆：' + esc(l.at) + '，來自「' + esc(l.label) + '」，' + num(l.n) + ' 筆明細。</div>';
  if (ins.canDecrypt === false) h += '<div style="color:var(--red);margin-top:4px"><b>但這台的密語解不開它 → 兩邊的密語不一樣。</b></div>';
  if (ins.canDecrypt === true) h += '<div style="color:var(--green);margin-top:4px"><b>密語正確，可正常解開。</b></div>';
  return h;
}
function refreshInspect() {
  const box = $('#syInspect');
  if (!box) return;
  box.innerHTML = '查詢中…';
  syncInspect().then(function (ins) { if ($('#syInspect')) box.innerHTML = inspectHtml(ins); });
}

/* ---- 連線測試：把每一步的結果老實列出來 ---- */
async function syncTest() {
  const out = [];
  try {
    const ua = (typeof navigator !== 'undefined' && navigator.userAgent) ? navigator.userAgent : '（未知）';
    out.push('瀏覽器：' + (/(Line|FBAN|FBAV|Instagram|MicroMessenger)/i.test(ua) ? '⚠ 這是 App 內建瀏覽器，可能擋掉對外連線' : '一般瀏覽器'));
    out.push('　' + ua.slice(0, 110));
  } catch (e) { }
  out.push('安全來源：' + ((typeof isSecureContext !== 'undefined' && isSecureContext) ? '是' : '否'));
  out.push('瀏覽器支援加密：' + (hasCrypto() ? '是' : '否'));
  if (!hasCrypto()) { showTest(out); return; }
  if (!syncReady()) { out.push('設定不完整，三個欄位都要填。'); showTest(out); return; }
  out.push('網址：' + esc(syncRoot()));
  out.push('金鑰格式：' + (/^eyJ/.test(SYNC.key) ? 'JWT（舊版 anon）' : /^sb_publishable_/.test(SYNC.key) ? 'Publishable（新版）' : '認不出來，請確認是 anon / Publishable'));
  out.push('密語長度：' + SYNC.pass.length + ' 個字元');
  out.push('金鑰：' + SYNC.key.slice(0, 22) + '…' + SYNC.key.slice(-4) + '（共 ' + SYNC.key.length + ' 字元）');
  // 先做一次「不帶標頭、不用 CORS」的連通測試：只問「這個瀏覽器到不到得了伺服器」
  try {
    await fetch(syncRoot() + '/rest/v1/', { mode: 'no-cors', cache: 'no-store' });
    out.push('基本連通：到得了 supabase.co ✓ → 所以問題在跨網域或金鑰，不是網路被擋');
  } catch (e) {
    out.push('基本連通：連 supabase.co 都到不了 ✗');
    out.push('  原始錯誤：' + (e && e.name) + ' / ' + (e && e.message));
    out.push('  → 這個瀏覽器或網路擋掉了它。常見原因：App 內建瀏覽器（LINE/FB）、');
    out.push('    私密瀏覽的防護、擋廣告外掛、公司的網路政策。');
  }
  try { SYNC.room = await roomOf(SYNC.pass); out.push('房間代碼：' + SYNC.room); }
  catch (e) { out.push('算出房間代碼失敗：' + esc(e.message)); showTest(out); return; }
  try {
    const res = await fetch(syncUrl('paijian_sync') + '?select=created_at&limit=1', { headers: syncHdr() });
    out.push('讀取資料表：HTTP ' + res.status + (res.ok ? ' ✓' : ''));
    if (!res.ok) out.push('伺服器回應：' + esc((await res.text()).slice(0, 300)));
  } catch (e) { out.push('讀取失敗（網路或網址）：' + esc(e.message)); }
  try {
    const res = await fetch(syncUrl('paijian_sync'), {
      method: 'POST', headers: syncHdr({ Prefer: 'return=minimal' }, true),
      body: JSON.stringify({ room: SYNC.room, label: (SYNC.label || '測試') + '（連線測試）', n: 0, payload: 'test' })
    });
    out.push('寫入資料表：HTTP ' + res.status + (res.ok ? ' ✓' : ''));
    if (!res.ok) out.push('伺服器回應：' + esc((await res.text()).slice(0, 300)));
  } catch (e) { out.push('寫入失敗：' + esc(e.message)); }
  try {
    const k = await deriveKey(SYNC.pass, SYNC.room);
    const d = await decryptStr(k, await encryptStr(k, 'hello'));
    out.push('加解密測試：' + (d === 'hello' ? '正常 ✓' : '不一致'));
  } catch (e) { out.push('加解密測試失敗：' + esc(e.message)); }
  const ins = await syncInspect();
  if (!ins.ok) out.push('查雲端內容：失敗 ' + esc(ins.err || ''));
  else if (!ins.rows) out.push('查雲端內容：這個房間是空的（0 筆）');
  else if (ins.canDecrypt === false) out.push('查雲端內容：有 ' + ins.rows + ' 筆，但密語解不開（兩邊密語不一樣）');
  else out.push('查雲端內容：有 ' + ins.rows + ' 筆，最新 ' + esc(ins.latest.at) + '（' + esc(ins.latest.label) + '）可正常解開，內含 ' + num(ins.recs) + ' 筆明細');
  showTest(out);
}
function showTest(lines) {
  const box = $('#syTestOut');
  if (!box) return;
  box.style.display = 'block';
  box.innerHTML = lines.map(function (l) { return '<div>' + l + '</div>'; }).join('');
}
function syncStatusBox() {
  if (!hasCrypto()) return '<div class="notice y" style="margin-bottom:9px">這個瀏覽器不支援 <code>crypto.subtle</code> 或 <code>CompressionStream</code>，沒辦法加密上傳。請用 Chrome、或 Safari 16.4+ / Firefox 113+。</div>';
  if (SYNC.needsPass && syncConfigured()) return '<div class="notice" style="margin-bottom:9px">連線設定已經內建在這個檔案裡，平常不用進來這一頁。<br>查看資料只要輸入密語就好。</div>';
  if (!syncReady()) return '<div class="notice" style="margin-bottom:9px">還沒設定。填好下面四個欄位，按「<b>儲存並上傳</b>」就完成。</div>';
  if (SYNC.status === 'busy') return '<div class="notice" style="margin-bottom:9px">正在同步…</div>';
  if (SYNC.status === 'err') return '<div class="notice r" style="margin-bottom:9px"><b>上次失敗：</b>' + esc(SYNC.msg) + '<br>可以按下面的「連線測試」看每一步的結果。</div>';
  if (SYNC.status === 'ok') return '<div class="notice" style="margin-bottom:9px"><b>已同步。</b>最後一次 ' + hm(SYNC.lastAt) + (SYNC.lastFrom ? '（' + esc(SYNC.lastFrom) + '）' : '') + '</div>';
  return '<div class="notice y" style="margin-bottom:9px"><b>已設定，但還沒上傳過。</b>按下面的「儲存並上傳」把目前這份資料推上去。</div>';
}

function syncStamp() {
  const el = $('#syncPill'); if (!el) return;
  if (SYNC.needsPass && syncConfigured()) {
    el.textContent = '輸入密語'; el.className = 'btn sm syncbad';
    el.title = '這是共用後台，點這裡輸入一次密語就會自動抓資料';
    return;
  }
  if (!syncReady()) { el.textContent = '未同步'; el.className = 'btn sm'; el.title = '點這裡設定雲端同步'; return; }
  const map = { idle:'尚未上傳', busy:'同步中…', ok:'已同步', err:'同步失敗', off:'未同步', needpass:'輸入密語' };
  el.textContent = map[SYNC.status] || '同步';
  el.className = 'btn sm' + (SYNC.status === 'ok' ? '' : SYNC.status === 'err' ? ' syncbad' : '');
  el.title = SYNC.status === 'err' ? SYNC.msg : (SYNC.lastAt ? '最後同步 ' + hm(SYNC.lastAt) + (SYNC.lastFrom ? '（' + SYNC.lastFrom + '）' : '') : '點這裡設定雲端同步');
}
function syncHdr(extra, withBody) {
  const h = { apikey: SYNC.key };
  if (withBody) h['Content-Type'] = 'application/json';   // 只有帶 body 的請求才需要
  // 舊版金鑰是 JWT（eyJ 開頭），同時放進 Authorization；
  // 新版 sb_publishable_… 不是 JWT，放進 Authorization 反而會 401，只能放 apikey。
  if (/^eyJ/.test(SYNC.key)) h.Authorization = 'Bearer ' + SYNC.key;
  return Object.assign(h, extra || {});
}
/* 把常見的失敗換成人看得懂的說明 */
function syncErr(e) {
  const m = String(e && e.message || e);
  if (/^HTTP 401/.test(m) || /Invalid API key|No API key/i.test(m))
    return '金鑰不對（401）。請填 anon / public 或 Publishable（sb_publishable_…）金鑰，不要用 secret / service_role。';
  if (/^HTTP 404/.test(m) || /Could not find the table|relation .* does not exist/i.test(m))
    return '找不到資料表（404）。SQL 那段還沒跑成功，請回 Supabase 的 SQL Editor 貼上並按 Run。';
  if (/^HTTP 403/.test(m) || /permission denied/i.test(m))
    return '權限不足（403）。SQL 那段少了 grant，請用最新版的 SQL 重跑一次。';
  if (/Failed to fetch|NetworkError|load failed|Network request failed/i.test(m))
    return '連不上 ' + syncRoot() + '（原始錯誤：' + m + '）—— 請按「連線測試」看是哪一層被擋。';
  return m;
}
async function syncPush(silent) {
  if (!syncReady() || !hasCrypto()) { if (!silent) toast('同步還沒設定好，或這個環境不支援加密', true); return; }
  if (SYNC.busy) return;
  SYNC.busy = true; SYNC.status = 'busy'; syncStamp();
  try {
    SYNC.room = await roomOf(SYNC.pass);
    const key = await deriveKey(SYNC.pass, SYNC.room);
    const raw = JSON.stringify({ v:1, month: DB.D.month, detail: DB.D.detail.length, data: DB.D, snapshots: DB.snapshots.slice(-10), at: Date.now() });
    const blob = await encryptStr(key, await deflateStr(raw).then(u8ToB64));
    const res = await fetch(syncUrl('paijian_sync'), {
      method: 'POST',
      headers: syncHdr({ Prefer: 'return=minimal' }, true),
      body: JSON.stringify({ room: SYNC.room, label: SYNC.label || '未命名裝置', n: DB.D.detail.length, payload: blob })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 140));
    SYNC.status = 'ok'; SYNC.lastAt = Date.now(); SYNC.lastFrom = '已上傳';
    toast('已上傳到雲端（' + DB.D.month + '，' + num(DB.D.detail.length) + ' 筆）');
    syncPrune();   // 每筆約 370KB，只留最新 15 份，不然免費空間會被塞滿
  } catch (e) {
    SYNC.status = 'err'; SYNC.msg = syncErr(e);
    if (!silent) toast('上傳失敗：' + SYNC.msg, true);
  }
  SYNC.busy = false; syncStamp();
}
/* 只保留這個房間最新 15 份，其餘刪掉（免費方案 500MB，一份約 370KB） */
async function syncPrune() {
  try {
    const base = syncUrl('paijian_sync');
    const room = 'room=eq.' + encodeURIComponent(SYNC.room);
    const r = await fetch(base + '?' + room + '&select=created_at&order=created_at.desc&offset=15&limit=1', { headers: syncHdr() });
    if (!r.ok) return;
    const rows = await r.json();
    if (!rows.length) return;
    await fetch(base + '?' + room + '&created_at=lt.' + encodeURIComponent(rows[0].created_at),
      { method: 'DELETE', headers: syncHdr({ Prefer: 'return=minimal' }) });
  } catch (e) { /* 清不掉不影響同步 */ }
}
async function syncPull(silent, joinMode) {
  if (!syncReady() || !hasCrypto()) { if (!silent) toast('同步還沒設定好', true); return; }
  if (SYNC.busy) return;
  SYNC.busy = true; SYNC.status = 'busy'; syncStamp();
  try {
    SYNC.room = await roomOf(SYNC.pass);
    const url = syncUrl('paijian_sync') + '?room=eq.' + encodeURIComponent(SYNC.room) +
      '&select=created_at,label,n,payload&order=created_at.desc&limit=1';
    const res = await fetch(url, { headers: syncHdr() });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 140));
    const rows = await res.json();
    if (!rows.length) {
      // 分清楚是「房間是空的」還是「根本沒有這個房間」
      let anyRow = false;
      try {
        const c = await fetch(syncUrl('paijian_sync') + '?select=created_at&limit=1', { headers: syncHdr() });
        if (c.ok) anyRow = (await c.json()).length > 0;
      } catch (e) { }
      SYNC.status = joinMode ? 'err' : 'idle';
      SYNC.msg = joinMode
        ? (anyRow
          ? '這個密語的房間裡沒有資料 —— 兩邊的密語可能不一樣。請跟上傳的那台確認用同一組。'
          : '雲端資料庫裡完全沒有資料 —— 上傳的那台還沒成功送上去過。')
        : '雲端還沒有資料';
      syncStamp();
      toast(SYNC.msg, true);
      SYNC.busy = false; return;
    }
    const row = rows[0];
    const key = await deriveKey(SYNC.pass, SYNC.room);
    // 上傳時是「先壓縮再加密」，所以下載要「先解密再解壓縮」——少一步就會解不開
    let plain;
    try { plain = await inflateToStr(b64ToU8(await decryptStr(key, row.payload))); }
    catch (e) { throw new Error('解不開上傳的內容，通常是密語跟另一台不一樣（或打錯字）。（' + e.message + '）'); }
    let obj;
    try { obj = JSON.parse(plain).data; }
    catch (e) { throw new Error('雲端內容不是預期的格式（' + e.message + '）'); }
    if (!obj || !obj.detail) throw new Error('雲端資料裡沒有明細');
    const prev = DB.D.detail ? buildSnapshot(DB.D, '同步前') : null;
    DB.D = obj;
    if (obj.prefs && obj.prefs.clinicName) DB.clinicName = Object.assign({}, obj.prefs.clinicName, DB.clinicName);
    DB.fileStamp = Date.parse(row.created_at) || Date.now();
    DB.delta = prev ? compareSnapshot(prev, buildSnapshot(DB.D, '同步後')) : null;
    if (prev) DB.prev = prev;
    initFilters(); await persist(); render();
    SYNC.status = 'ok'; SYNC.lastAt = Date.now(); SYNC.lastFrom = row.label || '雲端';
    toast('已從雲端更新（' + (row.label || '其他裝置') + ' · ' + fmtTS(row.created_at) + '）');
  } catch (e) {
    SYNC.status = 'err'; SYNC.msg = syncErr(e);
    if (!silent) toast('下載失敗：' + SYNC.msg, true);
  }
  SYNC.busy = false; syncStamp();
}
async function syncSaveCfg(keepOpen) {
  const fromShared = SYNC.needsPass && syncConfigured();
  const g = (id) => { const e = $(id); return e ? e.value.trim() : ''; };
  const uEl = $('#syUrl'), kEl = $('#syKey'), pEl = $('#syPass');
  if (uEl && uEl.value.trim()) SYNC.url = syncRoot(uEl.value);
  if (kEl && kEl.value.trim()) SYNC.key = kEl.value.trim();
  if (pEl) SYNC.pass = pEl.value.trim();
  if ($('#syLabel')) SYNC.label = g('#syLabel') || '未命名裝置';
  if ($('#syAuto')) SYNC.auto = !!$('#syAuto').checked;
  SYNC.needsPass = false;
  await Store.set('sync', { url: SYNC.url, key: SYNC.key, pass: SYNC.pass, label: SYNC.label, auto: SYNC.auto });
  SYNC.status = syncReady() ? 'idle' : 'off';
  syncStamp();
  if (!keepOpen) $('#dlg').close();
  if (SYNC.url && !/^https?:\/\//i.test(SYNC.url)) { toast('網址看起來不對，應該是 https://xxxx.supabase.co', true); return false; }
  if (!syncReady()) { toast('已清除同步設定'); return false; }
  if (SYNC.pass.length < 10 && !fromShared) toast('已儲存。提醒：密語只有 ' + SYNC.pass.length + ' 個字元，建議改成一句長一點的話。');
  return true;
}
async function syncClearCfg() {
  SYNC.url = SYNC.key = SYNC.pass = ''; SYNC.status = 'off';
  await Store.del('sync'); syncStamp(); $('#dlg').close(); toast('已清除同步設定');
}

/* ---------- 進入用的密語視窗：只有一個欄位 ---------- */
function dlgPassword() {
  const room = SYNC.room || '';
  openDlg('輸入密語即可查看', [
    '<p>這個後台由一人上傳報表，其他人只要輸入密語就能看到同一份資料。輸入一次之後就會記住，不用每次打。</p>',

    '<p style="color:var(--ink-3);font-size:11px;margin-top:8px;font-family:var(--mono);word-break:break-all">連線：' + esc(syncRoot()) + '</p>'

async function dlgPasswordGo() {

  SYNC.pass = ''; SYNC.needsPass = true;
  await Store.set('sync', { url: SYNC.url, key: SYNC.key, pass: '', label: SYNC.label, auto: SYNC.auto });
  syncStamp();
  dlgPassword();
}

/* ---------- 一個動作：存設定 + 立刻上傳，結果留在視窗裡 ---------- */
async function saveAndPush() {
  const okCfg = await syncSaveCfg(true);

async function joinShared() {

async function saveAndPull() {
  const okCfg = await syncSaveCfg(true);
  if (!okCfg) { dlgSync(); return; }
  await syncPull(false);

    ('<h4>管理者設定</h4>' +

<script>
/* ============================================================================
   VIEWS B — 留意名單、異常異動、明細查詢；匯入流程與初始化
   ============================================================================ */

/* ============================ 留意名單 ============================ */
const RISKS = [
  { id:'unpaid', name:'未繳費' },
  { id:'first',  name:'首次受檢' },
  { id:'senior', name:'65 歲以上' },
  { id:'proj',   name:'專案件' },
  { id:'over3',  name:'3 年以上回檢' },
];
function riskOf(r) {
  const out = [];
  if (!r[C.pay]) out.push('unpaid');
  if (r[C.tot] != null && r[C.tot] <= 1) out.push('first');
  if (r[C.age] != null && r[C.age] >= 65) out.push('senior');
  if (dict('proj', r[C.proj])) out.push('proj');
  if (r[C.over3]) out.push('over3');
  return out;
}
function viewWatch() {
  const D = DB.D;
  if (!D || !D.detail || D.detail.length === 0) {
    return panelPad('未來待檢', emptyBox('沒有資料', '請先匯入預約資料。'));
  }
  const today = todayISO();
  const to = addDays(today, DB.watchDays);
  let h = '';
  
  // 如果有月份不符，顯示提示
  if (hasMonthMismatch) {
    h += '<div class="notice" style="background:var(--amber-soft);border:1px solid var(--amber-line);padding:12px;margin-bottom:12px;border-radius:3px">' +
      '<b>⚠️ 月份不符：</b>目前選擇 <b>' + esc(DB.filter.month || '—') + '</b>，但資料月份為 <b>' + esc(D.month || '—') + '</b>。<br>' +
      '以下顯示所有未到檢的預約（不限日期）。' +
      '</div>';
  }
  
  // 控制列
  let ctrl = '<div class="srcline">' +
    '<span class="field"><label>檢視未來</label><span class="seg">' +
    [3,5,7,14].map(n => '<button data-wdays="' + n + '" aria-pressed="' + (DB.watchDays === n) + '">' + n + ' 天</button>').join('') +
    '</span></span>' +
    '<span class="field"><label>只看風險</label><span class="chips">' +
    RISKS.map(function (x) {
      return '<button class="chip" data-risk="' + x.id + '" aria-pressed="' + DB.watchRisk.has(x.id) + '">' + esc(x.name) + '</button>';
    }).join('') + '</span></span></div>';

  // 取得所有生技客服業務的預約
  const allBizRows = detailRows().filter(function (r) {
    return r[C.biz] >= 0;  // 只保留生技客服業務
  });

  // 檢查是否有月份不符的情況
  const hasMonthMismatch = monthMismatch();

  let rows;
  if (hasMonthMismatch) {
    // 月份不符時，顯示所有未到檢的預約（不限制日期）
    rows = allBizRows.filter(function (r) {
      return r[C.att] !== 1;  // 只顯示未到檢的
    });
  } else {
    // 月份符合時，使用原有的日期範圍篩選
    rows = allBizRows.filter(function (r) {
      const d = r[C.d];
      if (!d) return false;
      // 先嘗試符合日期範圍
      if (d >= today && d <= to) {
        if (r[C.att] === 1) return false;
        return true;
      }
      return false;
    });

    // 如果未來日期沒有資料，顯示所有未到檢的預約（無論日期）
    if (rows.length === 0) {
      rows = allBizRows.filter(function (r) {
        return r[C.att] !== 1;
      });
    }
  }

  // 風險篩選
  if (DB.watchRisk.size) {
    rows = rows.filter(function (r) {
      const rk = riskOf(r);
      for (const x of DB.watchRisk) if (rk.indexOf(x) < 0) return false;
      return true;
    });
  }
  rows.sort((a, b) => (a[C.d] < b[C.d] ? -1 : a[C.d] > b[C.d] ? 1 : (a[C.cl] - b[C.cl])));

  // 業務彙總
  const byBiz = {};
  rows.forEach(function (r) {
    const b = bizOf(r[C.biz]);
    const nm = bizLabel(r);
    if (!byBiz[nm]) byBiz[nm] = { name:nm, code: b ? b.code : '', n:0, unpaid:0, amt:0 };
    byBiz[nm].n++; byBiz[nm].amt += r[C.amt];
    if (!r[C.pay]) byBiz[nm].unpaid++;
  });
  const bl = Object.keys(byBiz).map(k => byBiz[k]);
  sortOf('watch.biz', 'n', -1);
  let body = '<table><thead><tr>' + thSort('watch.biz', 'name', '業務') + thSort('watch.biz', 'n', '待檢人數', 'n') +
    thSort('watch.biz', 'unpaid', '未繳費', 'n') + thSort('watch.biz', 'amt', '預估業績', 'n') + thPlain('占比', '') + '</tr></thead><tbody>';
  const maxN = Math.max(1, ...bl.map(x => x.n));
  sortRows(bl, 'watch.biz').forEach(function (x) {
    body += '<tr><td><div class="who"><span class="nm">' + esc(x.name) + '</span><span class="cd">' + esc(x.code) + '</span></div></td>' +
      '<td class="n"><b>' + num(x.n) + '</b></td>' +
      '<td class="n"' + (x.unpaid ? ' style="color:var(--red);font-weight:600"' : '') + '>' + (x.unpaid || '—') + '</td>' +
      '<td class="n">' + num(x.amt) + '</td>' +
      '<td><div class="bar"><i style="width:' + (x.n / maxN * 100) + '%"></i></div></td></tr>';
  });
  body += '</tbody><tfoot><tr><td>合計</td><td class="n">' + num(rows.length) + '</td><td class="n">' + num(bl.reduce((a,x)=>a+x.unpaid,0)) + '</td><td class="n">' + num(bl.reduce((a,x)=>a+x.amt,0)) + '</td><td></td></tr></tfoot></table>';
  CSV_EXPORTS['watch.biz'] = function () {
    return csvOf(['業務','代碼','待檢人數','未繳費','預估業績'],
      bl.map(function (x) { return [x.name, x.code, x.n, x.unpaid, x.amt]; }));
  };
  h += panelPad('未來 ' + DB.watchDays + ' 天待檢 — 業務分佈', '<div class="scroll" style="max-height:300px">' + body + '</div>', csvBtn('watch.biz'));

  // 明細（依業務分組）
  if (!rows.length) {
    h += '<div class="stack" style="margin-top:12px">' + panelPad('待檢名單', emptyBox(
      '未來 ' + DB.watchDays + ' 天沒有符合條件的名單',
      DB.watchRisk.size ? '試著放寬風險條件，或把天數拉長。' : (monthMismatch() ? '明細檔只有 ' + DB.D.month + ' 的資料。' : '這個期間沒有已預約但尚未到檢的人員。'))) + '</div>';
    return ctrl + h;
  }
  const byDate = {};
  rows.forEach(function (r) { if (!byDate[r[C.d]]) byDate[r[C.d]] = []; byDate[r[C.d]].push(r); });
  let list = '';
  Object.keys(byDate).sort().forEach(function (d) {
    const isToday = d === today, isTmrw = d === addDays(today, 1);
    list += '<details class="wl-group"' + (isToday ? ' open' : '') + '><summary>' +
      '<span class="nm">' + esc(mdy(d)) + '（' + esc(wdOf(d)) + '）</span>' +
      (isToday ? tag('今天', 'r') : isTmrw ? tag('明天', 'y') : '') +
      '<span class="cnt">' + byDate[d].length + ' 位待檢</span></summary>' +
      '<div class="panel" style="border-top:0;border-radius:0 0 3px 3px">' +
      '<table><thead><tr><th>時間</th><th>業務</th><th>診所</th><th>受檢者</th><th>類別</th><th class="n">金額</th><th>風險</th></tr></thead><tbody>';
    byDate[d].forEach(function (r) {
      const rk = riskOf(r);
      list += '<tr><td class="mono">' + esc(mdy(d)) + '</td>' +
        '<td>' + esc(bizLabel(r)) + '</td>' +
        '<td>' + esc(clName(dict('cl', r[C.cl]))) + '</td>' +
        '<td><b>' + esc(r[C.cust] || '—') + '</b>' + (r[C.age] != null ? ' <span style="color:var(--ink-3)">' + r[C.age] + '歲</span>' : '') + '</td>' +
        '<td>' + esc(dict('cat', r[C.cat])) + '</td>' +
        '<td class="n">' + num(r[C.amt]) + '</td>' +
        '<td>' + (rk.length ? rk.map(function (x) {
          const def = RISKS.find(y => y.id === x);
          const cls = x === 'unpaid' ? 'r' : x === 'senior' ? 'y' : 'n';
          return tag(def ? def.name : x, cls);
        }).join(' ') : '<span style="color:var(--ink-3)">一般</span>') + '</td></tr>';
    });
    list += '</tbody></table></div></details>';
  });
  CSV_EXPORTS['watch.list'] = function () {
    return csvOf(['檢日','星期','業務','診所','受檢者','年齡','類別','金額','繳費','風險'],
      rows.map(function (r) {
        const rk = riskOf(r).map(function (x) { const d = RISKS.find(y => y.id === x); return d ? d.name : x; }).join('/');
        return [r[C.d], wdOf(r[C.d]), bizLabel(r), clName(dict('cl', r[C.cl])), r[C.cust], r[C.age] == null ? '' : r[C.age],
          dict('cat', r[C.cat]), r[C.amt], r[C.pay] ? '已繳' : '未繳', rk];
      }));
  };
  h += '<div class="stack" style="margin-top:12px">' + panelPad('待檢名單（' + num(rows.length) + ' 位 · 依檢日排序）', list, csvBtn('watch.list')) + '</div>';
  return ctrl + h;
}

/* ============================ 異常異動 ============================ */
function viewDelta() {
  const D = DB.D, today = todayISO(), y = addDays(today, -1);
  let h = '';
  const d = DB.delta;

  /* ========== 摘要報表比較 ========== */
  if (d) {
    // A) 業績核對表 — 各業務營業額增減（工作表1）
    if (d.reconSummary && d.reconSummary.length) {
      let body = '<table><thead><tr><th>業務</th><th class="n">Δ總計</th><th class="n">Δ全檢</th><th class="n">Δ加選</th><th class="n">Δ一代</th><th class="n">Δ二代</th></tr></thead><tbody>';
      const sorted = d.reconSummary.slice().filter(function (x) { return bizPass(x.code); }).sort(function (a, b) { return Math.abs(b.dt) - Math.abs(a.dt); });
      sorted.forEach(function (x) {
        const cls = function (v) { return v > 0 ? ' style="color:var(--green);font-weight:600"' : (v < 0 ? ' style="color:var(--red);font-weight:600"' : ''); };
        body += '<tr><td><b>' + esc(x.name) + '</b> <span class="mono" style="color:var(--ink-3)">' + esc(x.code) + '</span></td>' +
          '<td class="n"' + cls(x.dt) + '>' + signed(x.dt) + '</td>' +
          '<td class="n"' + cls(x.df) + '>' + signed(x.df) + '</td>' +
          '<td class="n"' + cls(x.dj) + '>' + signed(x.dj) + '</td>' +
          '<td class="n"' + cls(x.dg1) + '>' + signed(x.dg1) + '</td>' +
          '<td class="n"' + cls(x.dg2) + '>' + signed(x.dg2) + '</td></tr>';
      });
      body += '</tbody></table>';
      h += '<div class="stack" style="margin-top:12px">' + panelPad('業績核對表 — 各業務營業額增減（工作表1）',
        '<div class="scroll" style="max-height:320px">' + body + '</div>') + '</div>';
    }

    // B) 業績核對表 — 明細異動（工作表3）
    if (d.reconDetail) {
      const rd2 = d.reconDetail;
      // 套用業務篩選
      const bizFilter = function (k) {
        const i = rd2.info(k);
        const bi = DB.D.biz.findIndex(function (b) { return b.code === codeOf(i.biz); });
        return !DB.filter.biz.size || (bi >= 0 && DB.filter.biz.has(bi));
      };
      const added_filtered = (rd2.added || []).filter(bizFilter);
      const removed_filtered = (rd2.removed || []).filter(bizFilter);
      const changes_filtered = (rd2.changes || []).filter(function (ch) { return bizFilter(ch.k); });
      const n_added = added_filtered.length;
      const n_removed = removed_filtered.length;
      const n_changes = changes_filtered.length;
      let body = '';
      if (n_added + n_removed + n_changes === 0) {
        body = '<div class="empty">這次匯入核對表明細沒有變化</div>';
      } else {
        body = '<table><thead><tr><th>業務</th><th>客戶編號+序號</th><th>分類</th><th>診所</th><th class="n">業績</th><th>狀態</th></tr></thead><tbody>';
        added_filtered.slice(0, 30).forEach(function (k) {
          const i = rd2.info(k);
          const base = k.split('#')[0];
          const parts = base.split('|');
          body += '<tr><td>' + esc(i.biz) + '</td><td class="mono">' + esc(parts[1] || '') + '</td>' +
            '<td>' + esc(parts[2] || '') + '</td><td>' + esc(i.clinic) + '</td><td class="n">—</td><td>' + '<span class="tag b">新增</span>' + '</td></tr>';
        });
        removed_filtered.slice(0, 30).forEach(function (k) {
          const i = rd2.info(k);
          const base = k.split('#')[0];
          const parts = base.split('|');
          body += '<tr><td>' + esc(i.biz) + '</td><td class="mono">' + esc(parts[1] || '') + '</td>' +
            '<td>' + esc(parts[2] || '') + '</td><td>' + esc(i.clinic) + '</td><td class="n">—</td><td>' + '<span class="tag r">取消</span>' + '</td></tr>';
        });
        changes_filtered.slice(0, 30).forEach(function (ch) {
          const i = rd2.info(ch.k);
          const base = ch.k.split('#')[0];
          const parts = base.split('|');
          body += '<tr><td>' + esc(i.biz) + '</td><td class="mono">' + esc(parts[1] || '') + '</td>' +
            '<td>' + esc(parts[2] || '') + '</td><td>' + esc(i.clinic) + '</td>' +
            '<td class="n" style="color:var(--amber)">' + num(ch.from) + '→' + num(ch.to) + '</td>' +
            '<td>' + '<span class="tag y">' + ch.field + '</span>' + '</td></tr>';
        });
        body += '</tbody></table>';
        if (n_added > 30 || n_removed > 30 || n_changes > 30) body += '<div class="k-foot" style="padding:7px 2px 0;color:var(--ink-3);font-size:11.5px">只顯示前 30 筆</div>';
      }
      const notice = '<div class="notice" style="margin-bottom:10px">新增 <b>' + n_added + '</b> 筆 · 取消 <b>' + n_removed + '</b> 筆 · 數值被改 <b>' + n_changes + '</b> 筆</div>';
      h += '<div class="stack" style="margin-top:12px">' + panelPad('業績核對表 — 明細異動（工作表3）', notice + '<div class="scroll" style="max-height:420px">' + body + '</div>') + '</div>';
    }

    // C) 已預約統計表 — 各業務預約增減（工作表1）
    if (d.bookedSummary && d.bookedSummary.length) {
      let body = '<table><thead><tr><th>業務</th><th>月份</th><th class="n">前次檢次</th><th class="n">本次檢次</th><th class="n">Δ檢次</th><th class="n">前次營收</th><th class="n">本次營收</th><th class="n">Δ營收</th></tr></thead><tbody>';
      d.bookedSummary.filter(function (x) { return bizPass(x.code); }).forEach(function (x) {
        const cls_cnt = x.d_cnt > 0 ? ' style="color:var(--green);font-weight:600"' : (x.d_cnt < 0 ? ' style="color:var(--red);font-weight:600"' : '');
        const cls_rev = x.d_rev > 0 ? ' style="color:var(--green);font-weight:600"' : (x.d_rev < 0 ? ' style="color:var(--red);font-weight:600"' : '');
        body += '<tr><td><b>' + esc(x.name) + '</b> <span class="mono" style="color:var(--ink-3)">' + esc(x.code) + '</span></td>' +
          '<td>' + esc(x.month) + '</td>' +
          '<td class="n">' + num(x.p_cnt) + '</td><td class="n">' + num(x.c_cnt) + '</td>' +
          '<td class="n"' + cls_cnt + '>' + signed(x.d_cnt) + '</td>' +
          '<td class="n">' + num(x.p_rev) + '</td><td class="n">' + num(x.c_rev) + '</td>' +
          '<td class="n"' + cls_rev + '>' + signed(x.d_rev) + '</td></tr>';
      });
      body += '</tbody></table>';
      h += '<div class="stack" style="margin-top:12px">' + panelPad('已預約統計表 — 各業務預約增減（工作表1）', '<div class="scroll" style="max-height:320px">' + body + '</div>') + '</div>';
    }

    // D) 月報 — 各業務達成率增減
    if (d.monthlySummary && d.monthlySummary.length) {
      let body = '<table><thead><tr><th>業務</th><th>月份</th><th class="n">前次已約</th><th class="n">本次已約</th><th class="n">Δ已約</th><th class="n">前次達成</th><th class="n">本次達成</th></tr></thead><tbody>';
      d.monthlySummary.filter(function (x) { return bizPass(x.code); }).forEach(function (x) {
        const cls_b = x.d_booked > 0 ? ' style="color:var(--green);font-weight:600"' : (x.d_booked < 0 ? ' style="color:var(--red);font-weight:600"' : '');
        const cls_r = x.d_rate > 0 ? ' style="color:var(--green);font-weight:600"' : (x.d_rate < 0 ? ' style="color:var(--red);font-weight:600"' : '');
        body += '<tr><td><b>' + esc(x.name) + '</b> <span class="mono" style="color:var(--ink-3)">' + esc(x.code) + '</span></td>' +
          '<td>' + esc(x.month) + '</td>' +
          '<td class="n">' + num(x.p_booked) + '</td><td class="n">' + num(x.c_booked) + '</td>' +
          '<td class="n"' + cls_b + '>' + signed(x.d_booked) + '</td>' +
          '<td class="n">' + x.p_rate + '%</td><td class="n"' + cls_r + '>' + x.c_rate + '%</td></tr>';
      });
      body += '</tbody></table>';
      h += '<div class="stack" style="margin-top:12px">' + panelPad('月報 — 各業務達成率增減', '<div class="scroll" style="max-height:320px">' + body + '</div>') + '</div>';
    }
  }



  if (!d) {
    const rows = detailRows();
    const dqFrom = addDays(today, -7);
    const recent = rows.filter(r => r[C.dq] >= dqFrom && r[C.dq] <= today);
    const newly = rows.filter(r => r[C.dq] === y).sort((a, b) => b[C.amt] - a[C.amt]);
    const W = (D.warn && D.warn.rows) || [];
    const warnY = {};
    W.forEach(function (r) {
      if (r[9] || r[17] || r[25]) { const k = r[0]; warnY[k] = (warnY[k] || 0) + r[9]; }
    });
    h += notice('<b>還沒有前一次的快照，所以無法比對「昨天 vs 今天」的完整異動。</b><br>' +
      '下面先用報表本身推得的部分：<b>預約日 = 昨天</b> 的新增預約，以及警訊表的「昨日增減」。<br>' +
      '從明天開始，每次匯入報表都會自動留下快照，就能看到取消、到檢狀態改變、繳費改變與各業務業績增減。', 'y');
    let body = '<table><thead><tr><th>業務</th><th>診所</th><th>受檢者</th><th>類別</th><th>檢日</th><th class="n">金額</th></tr></thead><tbody>';
    if (newly.length) newly.slice(0, 200).forEach(function (r) {
      body += '<tr><td>' + esc(bizLabel(r)) + '</td><td>' + esc(clName(dict('cl', r[C.cl]))) + '</td><td><b>' + esc(r[C.cust]) + '</b></td><td>' + esc(dict('cat', r[C.cat])) + '</td><td class="mono">' + esc(mdy(r[C.d])) + '</td><td class="n">' + num(r[C.amt]) + '</td></tr>';
    });
    body += '</tbody></table>';
    h += '<div class="stack" style="margin-top:12px">' + panelPad('最近 7 天的新增預約（依預約日）',
      recent.length ? '<div class="scroll" style="max-height:420px">' + (function () {
        const byD = {};
        recent.forEach(function (r) { if (!byD[r[C.dq]]) byD[r[C.dq]] = { n:0, amt:0, list:[] }; byD[r[C.dq]].n++; byD[r[C.dq]].amt += r[C.amt]; byD[r[C.dq]].list.push(r); });
        let o = '<table><thead><tr><th>預約日</th><th class="n">新增筆數</th><th class="n">金額合計</th><th>業務（筆數）</th></tr></thead><tbody>';
        Object.keys(byD).sort().reverse().forEach(function (k) {
          const t = {};
          byD[k].list.forEach(function (r) { const nm = bizLabel(r); t[nm] = (t[nm] || 0) + 1; });
          const tops = Object.keys(t).sort((a, b) => t[b] - t[a]).slice(0, 5).map(nm => esc(nm) + ' ' + t[nm]).join('、');
          o += '<tr><td class="mono">' + esc(mdy(k)) + '（' + esc(wdOf(k)) + '）</td><td class="n"><b>' + byD[k].n + '</b></td><td class="n">' + num(byD[k].amt) + '</td><td>' + tops + (Object.keys(t).length > 5 ? ' …' : '') + '</td></tr>';
        });
        return o + '</tbody></table>';
      })() + '</div>' : emptyBox('最近 7 天沒有新增預約', '預約日欄位裡沒有 ' + esc(dqFrom) + ' 之後的紀錄。')) + '</div>';

    const wt = Object.keys(warnY);
    if (wt.length) {
      let b2 = '<table><thead><tr><th>診所</th><th class="n">合計昨日增減</th></tr></thead><tbody>';
      wt.forEach(k => { b2 += '<tr><td>' + esc(clName(k)) + '</td><td class="n" style="color:' + (warnY[k] < 0 ? 'var(--red)' : 'var(--green)') + '">' + signed(warnY[k]) + '</td></tr>'; });
      b2 += '</tbody></table>';
      h += '<div class="stack" style="margin-top:12px">' + panelPad('警訊表的昨日增減（已預約人數）', b2) + '</div>';
    }
    return h;
  }

  if (d.staleFormat) {
    h += notice('<b>異動基準已重新建立。</b><br>' +
      '這次更新改變了紀錄的比對方式（把「業績金額」從身分裡拿掉），所以舊的快照不能直接比。<br>' +
      '從下一次匯入開始，異動就會正確顯示 —— 特別是<b>金額變動不會再被誤報成「取消＋新增」</b>。', 'y');
    return h;
  }
  const n = d.added.length + d.removed.length + d.attCh.length + d.payCh.length;
  if (!d.comparable) {
    h += notice('<b>這兩次的資料不是同一批，逐筆比對沒有意義。</b><br>' +
      '前一次快照（' + esc(d.prevDate) + '）跟現在的資料只有約 <b>' + pct0(d.overlap) + '</b> 是同一批。' +
      (d.prevDate !== d.curDate ? '通常是換了月份、或匯入的檔案涵蓋不同日期。' : '') +
      '下面只列出可以比的<b>彙總差異</b>。連續幾天匯入同一批資料，逐筆異動就會準。', 'y');
  } else {
    h += notice('比對基準：<b>' + esc(d.prevLabel || d.prevDate) + '</b> 的快照（' + esc(d.prevDate) + '） → 現在 ' + esc(d.curDate) + '。' +
      '<br>新增 <b>' + d.added.length + '</b> · 消失／取消 <b>' + d.removed.length + '</b> · 到檢狀態改變 <b>' + d.attCh.length + '</b> · 繳費狀態改變 <b>' + d.payCh.length + '</b>', '');
  }

  /* --- 業務端（只列有篩選到的業務） --- */
  sortOf('delta.biz', 'amt', 1);
  const bd = d.bizDelta.filter(function (x) { return bizPass(x.code); });
  let body = '<div class="scroll" style="max-height:420px"><table><thead><tr>' + thSort('delta.biz', 'name', '業務') +
    thSort('delta.biz', 'prevAmt', '前次業績', 'n') + thSort('delta.biz', 'nowAmt', '目前業績', 'n') +
    thSort('delta.biz', 'amt', '金額增減', 'n') + thSort('delta.biz', 'cnt', '筆數增減', 'n') + thPlain('判讀', '') +
    '</tr></thead><tbody>';
  if (!bd.length) body += '<tr><td colspan="6" style="color:var(--ink-3);padding:14px">目前的業務篩選裡沒有可比對的業務。</td></tr>';
  sortRows(bd, 'delta.biz').forEach(function (x) {
    const flags = [];
    if (x.nowAmt === 0 && x.prevAmt > 0) flags.push(tag('掉到 0', 'r'));
    else if (x.prevAmt > 0 && x.amt / x.prevAmt < -0.15) flags.push(tag('明顯下滑', 'y'));
    if (x.nowAmt > 0 && x.prevAmt === 0) flags.push(tag('新增業績', 'g'));
    if (x.amt > 0) flags.push(tag('成長', 'b'));
    if (!flags.length) flags.push('<span style="color:var(--ink-3)">持平</span>');
    body += '<tr><td><b>' + esc(x.name) + '</b></td>' +
      '<td class="n">' + num(x.prevAmt) + '</td><td class="n">' + num(x.nowAmt) + '</td>' +
      '<td class="n" style="color:' + (x.amt < 0 ? 'var(--red)' : x.amt > 0 ? 'var(--green)' : 'inherit') + ';font-weight:600">' + signed(x.amt) + '</td>' +
      '<td class="n">' + signed(x.cnt) + '</td><td>' + flags.join(' ') + '</td></tr>';
  });
  body += '</tbody></table></div>';
  h += '<div class="stack" style="margin-top:12px">' + panelPad('業務端 — 業績增減（生技客服）', body) + '</div>';

  /* --- 客戶端 --- */
  function listPanel(title, arr, kind) {
    if (!arr.length) return panelPad(title, emptyBox('沒有這一類異動', '比對基準到現在，這一類是空的。'));
    let b = '<div class="scroll" style="max-height:360px"><table><thead><tr><th>受檢者</th><th>業務</th><th>診所</th><th class="mono">檢日</th><th>類別</th><th class="n">金額</th><th>狀態</th></tr></thead><tbody>';
    arr.slice(0, 300).forEach(function (item) {
      let k, state = '';
      if (kind === 'add' || kind === 'del') { k = item; }
      else { k = item[0]; state = kind === 'att' ? (item[2] ? '未到 → 已到檢' : '已到檢 → 未到') : (item[2] ? '未繳費 → 已繳費' : '已繳費 → 未繳費'); }
      const i = d.info(k);
      const cls = kind === 'del' ? 'r' : kind === 'add' ? 'b' : 'y';
      b += '<tr><td><b>' + esc(i.cust) + '</b></td><td>' + esc(i.biz) + '</td><td>' + esc(i.cl) + '</td>' +
        '<td class="mono">' + esc(mdy(i.d)) + '</td><td>' + esc(i.cat) + '</td><td class="n">' + num(i.amt) + '</td>' +
        '<td>' + tag(state, cls) + '</td></tr>';
    });
    b += '</tbody></table></div>';
    if (arr.length > 300) b += '<div class="k-foot" style="padding:7px 2px 0;color:var(--ink-3);font-size:11.5px">只顯示前 300 筆，共 ' + arr.length + ' 筆。</div>';
    return panelPad(title + '（' + arr.length + '）', b);
  }
  if (!d.comparable) return h;
  h += '<div class="split even" style="margin-top:12px"><div class="stack">' +
    listPanel('新增預約', d.added, 'add') + '</div><div class="stack">' +
    listPanel('消失／取消', d.removed, 'del') + '</div></div>';
  h += '<div class="split even" style="margin-top:12px"><div class="stack">' +
    listPanel('到檢狀態改變', d.attCh, 'att') + '</div><div class="stack">' +
    listPanel('繳費狀態改變', d.payCh, 'pay') + '</div></div>';
  if (d.amtCh.length) {
    let b = '<table><thead><tr><th>受檢者</th><th>業務</th><th class="n">前次金額</th><th class="n">目前金額</th><th class="n">差額</th></tr></thead><tbody>';
    d.amtCh.slice(0, 200).forEach(function (x) {
      const i = d.info(x[0]);
      b += '<tr><td><b>' + esc(i.cust) + '</b></td><td>' + esc(i.biz) + '</td><td class="n">' + num(x[1]) + '</td><td class="n">' + num(x[2]) + '</td><td class="n" style="color:' + (x[2]-x[1] < 0 ? 'var(--red)' : 'var(--green)') + '">' + signed(x[2]-x[1]) + '</td></tr>';
    });
    b += '</tbody></table>';
    h += '<div class="stack" style="margin-top:12px">' + panelPad('同筆金額被改（' + d.amtCh.length + '）', '<div class="scroll" style="max-height:300px">' + b + '</div>') + '</div>';
  }
  return h;
}

/* ============================ 業績計算 ============================ */
function viewCommission() {
    const D = DB.D;

    // 取得最後上傳時間
    const lastUpload = DB.fileStamp ? new Date(DB.fileStamp) : null;
    const uploadTimeStr = lastUpload
        ? lastUpload.toLocaleString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' })
        : '未知';

    // 業績計算使用業績核對表資料
    if (!D || !D.recon || !D.recon.detail || D.recon.detail.length === 0) {
        return panelPad('業績計算', 
            '<div class="empty" style="padding:40px 20px;text-align:center">' +
            '<h3 style="color:var(--ink-2);margin-bottom:10px">尚未匯入業績核對表</h3>' +
            '<p style="color:var(--ink-3);margin-bottom:20px">業績計算需要「2026~生技客服業績核對表」的資料</p>' +
            '<div style="background:var(--surface-2);padding:15px;border-radius:8px;text-align:left;max-width:500px;margin:0 auto">' +
            '<p style="font-size:13px;color:var(--ink-2)"><b>請拖入以下檔案：</b></p>' +
            '<ul style="font-size:12px;color:var(--ink-3);margin:10px 0;padding-left:20px">' +
            '<li>2026~生技客服業績核對表 XXXX.xlsx</li>' +
            '</ul>' +
            '<p style="font-size:11px;color:var(--ink-3)">拖入後自動計算，無需手動上傳業績計算神表</p>' +
            '</div></div>');
    }

    const commission = calculateCommission(D);
    if (!commission || commission.length === 0) {
        return panelPad('業績計算', emptyBox('沒有業務資料', '業績核對表中沒有生技客服的紀錄。'));
    }

    // 計算總計
    const totals = {
        fullCheckRevenue: 0,
        addOnRevenue: 0,
        fullCheckBonus: 0,
        officialAddOnBonus: 0,
        secondGenBonus: 0,
        project66Bonus: 0,
        midHighBonus: 0,
        totalBonus: 0
    };
    commission.forEach(function (s) {
        totals.fullCheckRevenue += s.fullCheckRevenue;
        totals.addOnRevenue += s.addOnRevenue;
        totals.fullCheckBonus += s.fullCheckBonus;
        totals.officialAddOnBonus += s.officialAddOnBonus;
        totals.secondGenBonus += s.secondGenBonus;
        totals.project66Bonus += s.project66Bonus;
        totals.midHighBonus += s.midHighBonus;
        totals.totalBonus += s.totalBonus;
    });

    let body = '<table><thead><tr>' +
        thPlain('業務', '') + thSort('commission', 'fullCheckRevenue', '全檢業績', 'n') +
        thSort('commission', 'addOnRevenue', '加選業績', 'n') +
        thSort('commission', 'fullCheckBonus', '全檢獎金', 'n') +
        thSort('commission', 'officialAddOnBonus', '官網&加選', 'n') +
        thSort('commission', 'secondGenBonus', '二代獎金', 'n') +
        thSort('commission', 'project66Bonus', '66 加碼', 'n') +
        thSort('commission', 'midHighBonus', '中高加碼', 'n') +
        thSort('commission', 'totalBonus', '最終獎金', 'n') +
        '</tr></thead><tbody>';

    sortOf('commission', 'totalBonus', -1);
    const sorted = sortRows(commission, 'commission');

    sorted.forEach(function (s) {
        body += '<tr>' +
            '<td><b>' + esc(s.name) + '</b><br><span class="mono" style="color:var(--ink-3)">' + esc(s.code) + '</span></td>' +
            '<td class="n">' + num(s.fullCheckRevenue) + '</td>' +
            '<td class="n">' + num(s.addOnRevenue) + '</td>' +
            '<td class="n" style="color:var(--green)">' + num(Math.round(s.fullCheckBonus)) + '</td>' +
            '<td class="n">' + num(Math.round(s.officialAddOnBonus)) + '</td>' +
            '<td class="n">' + num(s.secondGenBonus) + '</td>' +
            '<td class="n">' + num(Math.round(s.project66Bonus)) + '</td>' +
            '<td class="n">' + num(Math.round(s.midHighBonus)) + '</td>' +
            '<td class="n" style="font-weight:600;color:var(--brand)">' + num(Math.round(s.totalBonus)) + '</td>' +
            '</tr>';
    });

    // 總計列
    body += '</tbody><tfoot><tr>' +
        '<td><b>總計</b></td>' +
        '<td class="n"><b>' + num(totals.fullCheckRevenue) + '</b></td>' +
        '<td class="n"><b>' + num(totals.addOnRevenue) + '</b></td>' +
        '<td class="n" style="color:var(--green)"><b>' + num(Math.round(totals.fullCheckBonus)) + '</b></td>' +
        '<td class="n"><b>' + num(Math.round(totals.officialAddOnBonus)) + '</b></td>' +
        '<td class="n"><b>' + num(totals.secondGenBonus) + '</b></td>' +
        '<td class="n"><b>' + num(Math.round(totals.project66Bonus)) + '</b></td>' +
        '<td class="n"><b>' + num(Math.round(totals.midHighBonus)) + '</b></td>' +
        '<td class="n" style="font-weight:600;color:var(--brand)"><b>' + num(Math.round(totals.totalBonus)) + '</b></td>' +
        '</tr></tfoot></table>';

    // CSV 匯出
    CSV_EXPORTS['commission'] = function () {
        const headers = ['業務', '代碼', '全檢業績', '加選業績', '全檢獎金', '官網&加選獎金', '二代獎金', '66 加碼', '中高加碼', '最終獎金'];
        const rows = sorted.map(function (s) {
            return [s.name, s.code, s.fullCheckRevenue, s.addOnRevenue,
                   Math.round(s.fullCheckBonus), Math.round(s.officialAddOnBonus),
                   s.secondGenBonus, Math.round(s.project66Bonus),
                   Math.round(s.midHighBonus), Math.round(s.totalBonus)];
        });
        return csvOf(headers, rows);
    };

    return panelPad('業績計算（自動試算）',
        '<div class="srcline">' +
        '<span class="rail-sum">共 ' + commission.length + ' 位業務 · 總獎金 ' + num(Math.round(totals.totalBonus)) + '</span>' +
        '<span class="rail-sum" style="color:var(--ink-3);font-size:11px;margin-left:10px">📅 資料截止：' + uploadTimeStr + '</span>' +
        csvBtn('commission', '匯出 CSV') + '</div>' +
        '<div class="scroll" style="max-height:min(70vh,760px)">' + body + '</div>');
}

function csvOf(head, rows) {
  const cell = (v) => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '﻿' + [head].concat(rows).map(r => r.map(cell).join(',')).join('\r\n');
}

/* ============================ 匯入 ============================ */
let importing = false;
async function runImport(files) {
  if (importing || !files || !files.length) return;
  importing = true;
  const list = $('#importList');
  $('#drop').classList.add('on');
  list.innerHTML = files.map(f => '<div><span class="no">' + esc(f.name) + '</span><span class="topbar-spacer"></span><span class="no">讀取中…</span></div>').join('');
  try {
    const items = [];
    for (const f of files) {
      const buf = await f.arrayBuffer();
      items.push({ name: f.name, buffer: buf });
    }
    const res = await RP.parseFiles(items, {});
    // 先存快照（以匯入前的資料為基準）
    const before = DB.D.detail ? buildSnapshot(DB.D, '匯入前') : null;
    applyPatch(res.patch);
    if (res.patch.dicts) DB.D.dicts = res.patch.dicts;
    if (res.patch.detailCols) DB.D.detailCols = res.patch.detailCols;
    DB.fileStamp = Date.now();
    DB.delta = before ? compareSnapshot(before, buildSnapshot(DB.D, '匯入後')) : null;
    if (before) { DB.prev = before; DB.snapshots = [].concat(DB.snapshots, [shallowSnap(before)]).slice(-40); }
    if (DB.delta) pushHistory(before);
    await persist();
    if (SYNC.auto && syncReady()) syncPush(true);
    list.innerHTML = res.report.map(r =>
      '<div><span class="' + (r.status === 'ok' ? 'no' : r.status === 'error' ? 'er' : 'no') + '">' + esc(r.name) + '</span>' +
      '<span class="topbar-spacer"></span><span class="' + (r.status === 'ok' ? 'ok' : r.status === 'error' ? 'er' : 'no') + '">' +
      (r.status === 'ok' ? '✓ ' + esc(r.msg) : (r.status === 'error' ? '✕ ' : '？ ') + esc(r.msg)) + '</span></div>').join('');
    render();
    setTimeout(function () {
      $('#drop').classList.remove('on');
      const ok = res.report.filter(r => r.status === 'ok').length;
      toast(ok ? '已更新 ' + ok + ' 份報表' : '沒有可用的報表', !ok);
    }, 900);
  } catch (e) {
    $('#drop').classList.remove('on');
    toast('匯入失敗：' + e.message, true);
  }
  importing = false;
}
function shallowSnap(s) { return { label:s.label, date:s.date, ts:s.ts, n:s.n, month:s.month, bizAgg:s.bizAgg, kpi:s.kpi }; }
function pushHistory(snap) {
  if (!snap) return;
  const day = todayISO();
  DB.history = DB.history.filter(h => h.date !== day);
  DB.history.push({ date:day, ts:Date.now(), n:snap.n, kpi:snap.kpi, bizAgg:snap.bizAgg });
  DB.history = DB.history.slice(-120);
}

function render() {
  if (!DB.D) return;

  const keep = $$('#views .scroll').map(function (e) { return e.scrollTop; });

    }, 0);

/* 表格內的篩選控制項：文字輸入延遲 250ms 再重繪 */
function wireTableControls() {
  $$('#views [data-tf]').forEach(function (el) {
    const isText = el.tagName === 'INPUT' && (el.type === 'search' || el.type === 'date');
    let timer = null;
    const apply = function () {
      const attr = el.getAttribute('data-tf').split('|');
      if (!DB.tf[attr[0]]) DB.tf[attr[0]] = {};
      DB.tf[attr[0]][attr[1]] = el.value;
      const pos = el.selectionStart;
      const foc = document.activeElement === el;
      render();
      if (foc && el.type !== 'date') {
        const n2 = document.querySelector('[data-tf="' + el.getAttribute('data-tf') + '"]');
        if (n2) { n2.focus(); try { n2.setSelectionRange(pos, pos); } catch (e) { } }
      }
    };
    el.addEventListener(isText ? 'input' : 'change', function () {
      if (!isText) { apply(); return; }
      clearTimeout(timer); timer = setTimeout(apply, 250);
    });
  });
}

function download(blob, name) {
  const a = document.createElement('a');

}

  if (DB.prev) await Store.set('prev', DB.prev);
  if (DB.D) await Store.set('data', { savedAt: Date.now(), payload: DB.D });

/* ============================ 事件 ============================ */
function wire() {
  document.addEventListener('click', function (e) {
    const t = e.target.closest('[data-tab],[data-biz],[data-act],[data-clinic],[data-wdays],[data-risk],[data-dtab],[data-sort],[data-cleartf],[data-csv],#syTest,#syCopy,#syCopyUrl,#syCopyKey,#syJoin,#pwGo,#pwSetup,#btnImport,#miBackup,#miRestore,#miSnapshot,#miSnapshots,#miClinic,#miHelp,#miDeploy,#miExport,#miSync,#syncPill,#btnReset,#dlgClose,#dlgX,#dlgX2,#dlgX3,#dlgSaveClinic,#dlgDoReset,#sySave,#syClear,#syPush,#syPull,#btnMenu');
    if (!t) { const m = $('#menuPanel'); if (m && !m.hidden && !e.target.closest('.menu-wrap')) { m.hidden = true; $('#btnMenu').setAttribute('aria-expanded', 'false'); } return; }
    const D = DB.filter;
    if (t.hasAttribute('data-sort')) {
      const a = t.getAttribute('data-sort').split('|');
      const s = DB.sort[a[0]] || (DB.sort[a[0]] = {});
      if (s.k === a[1]) s.dir = -(s.dir || -1); else { s.k = a[1]; s.dir = -1; }
      render(); return;
    }
    if (t.hasAttribute('data-cleartf')) { clearTf(t.getAttribute('data-cleartf')); render(); return; }
    if (t.hasAttribute('data-csv')) { saveCsv(t.getAttribute('data-csv'), t.getAttribute('data-csvname')); return; }
    if (t.hasAttribute('data-tab')) { DB.view = t.getAttribute('data-tab'); render(); return; }
    if (t.hasAttribute('data-dtab')) { DB.dataTab = t.getAttribute('data-dtab'); DB.dataQuery = ''; render(); return; }
    if (t.hasAttribute('data-wdays')) { DB.watchDays = +t.getAttribute('data-wdays'); render(); return; }
    if (t.hasAttribute('data-risk')) {
      const id = t.getAttribute('data-risk');
      if (DB.watchRisk.has(id)) DB.watchRisk.delete(id); else DB.watchRisk.add(id);
      render(); return;
    }
    if (t.hasAttribute('data-biz')) {
      const i = +t.getAttribute('data-biz');
      if (D.biz.has(i)) D.biz.delete(i); else D.biz.add(i);
      render(); return;
    }
    if (t.getAttribute('data-act') === 'all-biz') {
      if (D.biz.size === DB.D.biz.length) D.biz.clear(); else DB.D.biz.forEach((b, i) => D.biz.add(i));
      render(); return;
    }
    if (t.hasAttribute('data-clinic')) {
      const c = t.getAttribute('data-clinic');
      if (D.clinic.has(c)) D.clinic.delete(c); else D.clinic.add(c);
      render(); return;
    }
    if (t.getAttribute('data-act') === 'all-clinic') {
      const all = DB.D.dicts.cl || [];
      if (D.clinic.size === all.length) D.clinic.clear(); else all.forEach(c => D.clinic.add(c));
      render(); return;
    }
    if (t.id === 'btnReset') { D.biz.clear(); D.clinic.clear(); DB.watchRisk.clear(); DB.dataQuery = ''; DB.tf = {}; DB.sort = {}; render(); return; }
    if (t.id === 'btnImport') { $('#filePick').click(); return; }
    if (t.id === 'btnMenu') { const m = $('#menuPanel'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', String(!m.hidden)); return; }
    if (t.id === 'miBackup') { $('#menuPanel').hidden = true; doBackup(); return; }
    if (t.id === 'miRestore') { $('#menuPanel').hidden = true; $('#restorePick').click(); return; }
    if (t.id === 'miSnapshot') {
      $('#menuPanel').hidden = true;
      const s = buildSnapshot(DB.D, '手動快照 ' + todayISO());
      DB.prev = s; DB.snapshots = DB.snapshots.concat([shallowSnap(s)]).slice(-40);
      DB.delta = null; persist(); render(); toast('已把目前資料存成快照'); return;
    }
    if (t.id === 'miSnapshots') { $('#menuPanel').hidden = true; dlgSnapshots(); return; }
    if (t.id === 'miClinic') { $('#menuPanel').hidden = true; dlgClinic(); return; }
    if (t.id === 'miHelp') { $('#menuPanel').hidden = true; dlgHelp(); return; }
    if (t.id === 'miDeploy') { $('#menuPanel').hidden = true; dlgDeploy(); return; }
    if (t.id === 'miExport') { $('#menuPanel').hidden = true; exportHtml(false); return; }
    if (t.id === 'miExportBlank') { $('#menuPanel').hidden = true; exportHtml(true); return; }
    if (t.id === 'miExportShared') { $('#menuPanel').hidden = true; exportHtmlShared(); return; }
    if (t.id === 'pwGo') { dlgPasswordGo(); return; }
    if (t.id === 'pwSetup') { $('#dlg').close(); dlgSync(); return; }
    if (t.id === 'miSync' || t.id === 'syncPill') { $('#menuPanel').hidden = true; dlgSync(); return; }
    if (t.id === 'sySave' || t.id === 'syPush') { saveAndPush(); return; }
    if (t.id === 'syClear') { syncClearCfg(); return; }
    if (t.id === 'syPull') { saveAndPull(); return; }
    if (t.id === 'syJoin') { joinShared(); return; }
    if (t.id === 'syTest') { syncTest(); return; }
    if (t.id === 'syCopyKey') {
      const f = $('#syKey');
      if (f) { try { f.removeAttribute('readonly'); f.select(); document.execCommand('copy'); toast('已複製金鑰'); } catch (e) { toast('請手動全選複製', true); } }
      return;
    }
    if (t.id === 'syCopyUrl') {
      const f = $('#syUrl');
      if (f) { try { f.removeAttribute('readonly'); f.select(); document.execCommand('copy'); toast('已複製網址：' + f.value); } catch (e) { toast('請手動全選複製', true); } }
      return;
    }
    if (t.id === 'syCopy') {
      const f = $('#syLink');
      if (f) { try { f.removeAttribute('readonly'); f.select(); document.execCommand('copy'); f.setAttribute('readonly', 'readonly'); toast('已複製分享連結，傳給排檢人員就好'); } catch (e) { toast('請手動全選複製', true); } }
      return;
    }
    if (t.id === 'dlgX3') { $('#dlg').close(); return; }
    if (t.id === 'miReset') { $('#menuPanel').hidden = true; dlgReset(); return; }
    if (t.id === 'dlgClose' || t.id === 'dlgX' || t.id === 'dlgX2') { $('#dlg').close(); return; }
    if (t.id === 'dlgSaveClinic') {
      $$('#dlgBody [data-clcode]').forEach(function (inp) {
        const v = inp.value.trim(); const c = inp.getAttribute('data-clcode');
        if (v) DB.clinicName[c] = v; else delete DB.clinicName[c];
      });
      $('#dlg').close(); persist(); render(); toast('已更新診所名稱'); return;
    }
    if (t.id === 'dlgDoReset') {
      ['meta','history','snapshots','prev','data'].forEach(k => Store.del(k));
      DB.prev = null; DB.delta = null; DB.history = []; DB.snapshots = []; DB.clinicName = {}; DB.fileStamp = null;
      DB.filter = { biz:new Set(), clinic:new Set(), month: DB.D.month };
      $('#dlg').close(); persist(); render(); toast('已清除本機資料'); return;
    }
  });

  $('#fMonth').addEventListener('change', function () { DB.filter.month = this.value; render(); });
  $('#filePick').addEventListener('change', function () { runImport(Array.from(this.files)); this.value = ''; });
  $('#restorePick').addEventListener('change', async function () {
    const f = this.files[0]; this.value = ''; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (!j.data) throw new Error('備份檔裡沒有資料');
      DB.D = j.data; DB.clinicName = j.clinicName || {}; DB.prev = j.prev || null;
      DB.history = j.history || []; DB.snapshots = j.snapshots || []; DB.fileStamp = j.fileStamp || Date.now();
      DB.delta = j.prev ? compareSnapshot(j.prev, buildSnapshot(DB.D, '還原後')) : null;
      initFilters(); await persist(); render(); toast('已還原備份');
    } catch (e) { toast('還原失敗：' + e.message, true); }
  });
  // 拖放
  let dragDepth = 0;
  window.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; $('#drop').classList.add('on'); if (!$('#importList').innerHTML) $('#importList').innerHTML = '<div><span class="no">放開以讀取…</span></div>'; });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('dragleave', function (e) { dragDepth--; if (dragDepth <= 0 && !importing) $('#drop').classList.remove('on'); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0;
    const fs = Array.from(e.dataTransfer.files || []);
    if (!fs.length) { $('#drop').classList.remove('on'); return; }
    runImport(fs);
  });
}

/* ============================ 初始化 ============================ */
function initFilters() {
  DB.filter.biz = new Set();
  DB.filter.clinic = new Set();
  DB.filter.month = DB.D.month || (DB.D.monthly && DB.D.monthly.months[0]) || '';
}
async function boot() {
 try{
  // 1) 還原內建 payload
  let baked = null;
  try {
    const b64 = ($('#payload').textContent || '').trim();
    if (b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
      baked = JSON.parse(await new Response(stream).text());
    }
  } catch (e) { console.warn('內建資料解壓失敗', e); }

  await Store.init();
  const stored = await Store.get('data');
  const meta = (await Store.get('meta')) || {};
  DB.prev = (await Store.get('prev')) || null;
  DB.history = (await Store.get('history')) || [];
  DB.snapshots = (await Store.get('snapshots')) || [];
  DB.clinicName = meta.clinicName || {};
  DB.fileStamp = meta.fileStamp || null;

  if (stored && stored.payload && stored.savedAt > Date.parse(baked ? (baked.generatedAt || 0) : 0)) {
    DB.D = stored.payload; DB.dataSavedAt = stored.savedAt;
  } else if (baked) {
    DB.D = baked;
  } else if (stored && stored.payload) {
    DB.D = stored.payload;
  }
  if (!DB.D) {
    $('#kpis').innerHTML = '<div class="kpi" style="grid-column:1/-1"><div class="k-label">沒有資料</div><div class="k-val">—</div><div class="k-foot">請拖入報表</div></div>';
    return;
  }
  initFilters();
  if (DB.D.prefs && DB.D.prefs.clinicName) DB.clinicName = Object.assign({}, DB.D.prefs.clinicName, DB.clinicName);
  if (DB.prev) DB.delta = compareSnapshot(DB.prev, buildSnapshot(DB.D, '目前'));
  wire();
  render();
  await syncInit(); syncStamp();
  const fromLink = await syncFromHash();
  if (fromLink) { syncStamp(); toast('已套用分享連結的同步設定，正在抓取資料…'); }
  if (SYNC.auto && syncReady()) syncPull(true);
  else if (SYNC.needsPass) setTimeout(function () { dlgPassword(); }, 400);
  toast('已載入 ' + DB.D.month + ' 報表，共 ' + num(DB.D.detail.length) + ' 筆預約明細', false);
 } catch (err) {
   console.error('boot 失敗', err);
   const k = document.getElementById('kpis');
   if (k) k.innerHTML = '<div class="kpi" style="grid-column:1/-1"><div class="k-label">載入失敗</div><div class="k-val">—</div><div class="k-foot">' + esc(err.message) + '</div></div>';
   throw err;
 }
}
window.addEventListener('error', function (e) { try { console.error(e.error || e.message); } catch (x) { } });

boot();
</script>
</body>
</html>
