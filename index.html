<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排檢管理台 · 美兆生技客服</title>
<style>
/* ============================================================
   排檢管理台 — design tokens
   base  : 冷調紙白 + 墨綠（健檢／診所語彙）
   signal: 沿用報表本身的紅／黃／綠燈號，不另外發明顏色
   rules : 細線是結構，不是裝飾（報表本身就是格線表）
   ============================================================ */
:root{
  --paper:#F5F7F4;
  --surface:#FFFFFF;
  --surface-2:#EFF2ED;
  --surface-3:#E7EBE4;
  --line:#DCE1D9;
  --line-2:#C6CDC1;
  --ink:#16211C;
  --ink-2:#4C5A53;
  --ink-3:#7E8C84;
  --brand:#0E5C4A;
  --brand-ink:#0A4436;
  --brand-soft:#E3EEE8;
  --brand-line:#9EC0B2;
  --red:#BB3A2E;      --red-soft:#FAEAE7;   --red-line:#E7BCB5;
  --amber:#B8780F;    --amber-soft:#FBF0DC; --amber-line:#E8CE9B;
  --green:#2C7A4F;    --green-soft:#E4F0E8; --green-line:#B0CDBA;
  --sky:#356F70;      --sky-soft:#E4EEEE;
  --gold:#A9842A;
  --r:3px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --shadow:0 1px 2px rgba(22,33,28,.05),0 8px 24px -16px rgba(22,33,28,.18);
}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:13px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 0;
}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
select,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:16px;
  padding:0 20px;height:52px;
  background:var(--surface);border-bottom:1px solid var(--line-2);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{
  width:22px;height:22px;flex:0 0 22px;border-radius:2px;
  background:var(--brand);
  background-image:linear-gradient(var(--brand-ink) 0 0),linear-gradient(var(--brand-ink) 0 0);
  background-size:3px 11px,3px 6px;background-position:6px 6px,13px 6px;background-repeat:no-repeat;
}
.brand h1{font-size:14.5px;font-weight:650;letter-spacing:.01em;line-height:1.2}
.brand p{font-size:11.5px;color:var(--ink-3);line-height:1.3}
.topbar-spacer{flex:1}
.fresh{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.fresh .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 7px}
.fresh.stale .dot{background:var(--amber)}
.fresh.old .dot{background:var(--red)}
.fresh small{color:var(--ink-3)}

.btn{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;
  border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);
  font-size:12.5px;font-weight:550;color:var(--ink);white-space:nowrap;
  transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
.btn.icon{padding:0 8px}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.syncbad{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
#syncPill{color:var(--ink-3)}

.menu-wrap{position:relative}
.menu{
  position:absolute;right:0;top:36px;z-index:60;min-width:236px;padding:5px;
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);
}
.menu[hidden]{display:none}
.menu button,.menu label{
  display:flex;width:100%;align-items:center;gap:8px;padding:7px 9px;border-radius:2px;
  font-size:12.5px;text-align:left;color:var(--ink);
}
.menu button:hover,.menu label:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.menu .hint{color:var(--ink-3);font-size:11px;padding:4px 9px 6px;line-height:1.45}

/* ---------- filter rail ---------- */
.rail{
  position:sticky;top:52px;z-index:35;
  display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;
  padding:9px 20px;background:var(--paper);
  border-bottom:1px solid var(--line);
}
.rail-group{display:flex;align-items:center;gap:8px;min-width:0}
.rail-group>label{font-size:11.5px;color:var(--ink-3);flex:0 0 auto;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;
  border:1px solid var(--line-2);border-radius:99px;background:var(--surface);
  font-size:12px;color:var(--ink-2);white-space:nowrap;transition:.12s;
}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:550}
.chip .cc{font-family:var(--mono);font-size:10.5px;opacity:.72}
.rail select{
  height:26px;padding:0 6px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);font-size:12.5px;
}
.rail-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.rail-sum{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.linkbtn{font-size:12px;color:var(--brand);text-decoration:underline;text-underline-offset:2px}

/* ---------- layout ---------- */
main{padding:16px 20px 64px;max-width:1660px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:13px;font-weight:640}
.panel-h .sub{font-size:11.5px;color:var(--ink-3)}
.panel-h .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.panel-b{padding:12px 14px}
.grid{display:grid;gap:12px}

/* ---------- KPI strip ---------- */
.kpis{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin-bottom:14px;
}
.kpi{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .k-label{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;line-height:1.35}
.kpi .k-val{font-size:22px;font-weight:640;letter-spacing:-.015em;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.15}
.kpi .k-val small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:2px}
.kpi .k-foot{font-size:11.5px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .k-foot b{font-weight:600;color:var(--ink-2)}
.kpi.warn .k-val{color:var(--amber)}
.kpi.bad .k-val{color:var(--red)}
.kpi.good .k-val{color:var(--brand)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;margin-bottom:12px;border-bottom:1px solid var(--line-2);overflow-x:auto}
.tab{
  padding:8px 13px 9px;font-size:12.5px;font-weight:550;color:var(--ink-3);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tab .badge{
  font-size:10.5px;font-weight:650;padding:1px 5px;border-radius:99px;
  background:var(--surface-3);color:var(--ink-2);font-variant-numeric:tabular-nums;
}
.tab .badge.alert{background:var(--red-soft);color:var(--red)}
.tab .badge.caution{background:var(--amber-soft);color:var(--amber)}
.view[hidden]{display:none}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{
  background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:11.5px;
  border-bottom:1px solid var(--line-2);white-space:nowrap;
}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{border-top:1px solid var(--line-2);border-bottom:0;font-weight:640;background:var(--surface-2)}
.scroll{max-height:min(66vh,760px);overflow:auto}
.scroll thead th{top:0}
th.sorted{background:var(--brand-soft);color:var(--brand-ink)}
.thb{
  display:inline-flex;align-items:center;gap:4px;width:100%;justify-content:inherit;
  font:inherit;color:inherit;padding:0;cursor:pointer;text-align:inherit;
}
th.n .thb{justify-content:flex-end}
.thb:hover{color:var(--brand)}
.thb .ar{font-size:9px;opacity:.85;width:8px}
.tfbar{display:flex;flex-wrap:wrap;gap:9px 14px;align-items:center;margin-bottom:10px;padding:9px 11px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r)}
.tfbar select,.tfbar input[type=date]{height:26px;padding:0 6px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);font-size:12.5px}
.tfbar .field label{font-size:11.5px;color:var(--ink-3)}
.tfcount{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* rank / name cell */
.who{display:flex;align-items:center;gap:8px;min-width:0}
.rk{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:14px;flex:0 0 14px;text-align:right}
.who .nm{font-weight:600;white-space:nowrap}
.who .cd{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}

/* progress rule */
.bar{position:relative;height:5px;background:var(--surface-3);border-radius:99px;min-width:52px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:99px;display:block}
.bar>i.warn{background:var(--amber)}
.bar>i.bad{background:var(--red)}
.bar-wrap{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar-wrap .pc{font-variant-numeric:tabular-nums;font-weight:600;min-width:38px;text-align:right}
.bar-wrap .bar{width:64px}

/* light dots (報表自己的紅黃綠燈號) */
.lamp{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.lamp.r{background:var(--red)} .lamp.y{background:var(--amber)} .lamp.g{background:var(--green)}
.lamp.none{background:var(--line-2)}
.lampcell{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-variant-numeric:tabular-nums}

.tag{display:inline-block;padding:1px 6px;border-radius:2px;font-size:11px;font-weight:550;white-space:nowrap;border:1px solid transparent}
.tag.b{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand-line)}
.tag.r{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}
.tag.y{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.tag.g{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.tag.n{background:var(--surface-3);color:var(--ink-2);border-color:var(--line-2)}
.tag.s{background:var(--sky-soft);color:var(--sky);border-color:#A9C6C6}

/* ---------- capacity board (6 週排檢量) ---------- */
.board{display:grid;gap:3px;grid-auto-rows:minmax(30px,auto)}
.board .bhead{font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;justify-content:center;padding-right:6px;white-space:nowrap}
.board .bhead b{color:var(--ink);font-weight:600;font-size:12px}
.board .colhead{font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.2;padding-bottom:2px}
.board .colhead b{display:block;color:var(--ink-2);font-weight:600;font-size:11.5px}
.cell{
  border:1px solid var(--line);border-radius:2px;padding:4px 6px;min-height:30px;
  display:flex;flex-direction:column;justify-content:center;gap:1px;
  font-variant-numeric:tabular-nums;position:relative;
}
.cell .cv{font-size:12.5px;font-weight:620;line-height:1.15}
.cell .cr{font-size:10px;color:var(--ink-3);line-height:1.15}
.cell.r{background:var(--red-soft);border-color:var(--red-line)}
.cell.y{background:var(--amber-soft);border-color:var(--amber-line)}
.cell.g{background:var(--green-soft);border-color:var(--green-line)}
.cell.empty{background:var(--surface-2);border-style:dashed;color:var(--ink-3)}
.cell.empty .cv{color:var(--ink-3);font-weight:500}
.cell.off{background:transparent;border-color:transparent}
.cell.off .cv{color:var(--line-2)}
.cell .dpop{
  position:absolute;inset:0;background:#fff;border:1px solid var(--ink-3);border-radius:2px;
  padding:4px 6px;font-size:10px;line-height:1.4;color:var(--ink-2);display:none;z-index:6;
  box-shadow:0 4px 14px -6px rgba(22,33,28,.45);
}
.cell:hover .dpop{display:block}

/* ---------- watchlist rows ---------- */
.risk{display:inline-flex;align-items:center;gap:5px}
.wl-group{margin-bottom:10px}
.wl-group>summary{
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px;padding:7px 10px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:2px;font-size:12.5px;
}
.wl-group>summary::-webkit-details-marker{display:none}
.wl-group>summary .nm{font-weight:620}
.wl-group>summary .cnt{margin-left:auto;color:var(--ink-3);font-size:11.5px;font-variant-numeric:tabular-nums}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.chart text{font-size:10.5px;fill:var(--ink-3);font-family:var(--sans)}
.chart text.vl{fill:var(--ink-2);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* split panels */
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;align-items:start}
.split.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stack{display:grid;gap:12px}
@media (max-width:1180px){.split,.split.even{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.rail{padding:8px 12px}main{padding:12px 12px 56px}}

/* ---------- empty / notice ---------- */
.empty{padding:24px 14px;text-align:center;color:var(--ink-3);font-size:12.5px}
.empty b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:4px;font-size:13px}
.notice{
  display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:2px;
  background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand-ink);
  font-size:12.5px;line-height:1.5;
}
.notice.y{background:var(--amber-soft);border-color:var(--amber-line);color:#6E4A0B}
.notice.r{background:var(--red-soft);border-color:var(--red-line);color:#7E2A20}
.notice b{font-weight:640}
.notice .x{margin-left:auto;color:inherit;opacity:.6;font-size:14px;line-height:1}

/* ---------- drop overlay ---------- */
.drop{
  position:fixed;inset:0;z-index:90;display:none;place-items:center;
  background:rgba(22,33,28,.42);backdrop-filter:blur(2px);
}
.drop.on{display:grid}
.drop .box{
  background:var(--surface);border:2px dashed var(--brand);border-radius:6px;
  padding:34px 46px;text-align:center;max-width:90vw;
}
.drop .box b{display:block;font-size:16px;font-weight:640;margin-bottom:5px}
.drop .box p{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.importlist{margin-top:12px;text-align:left;font-size:12.5px;max-height:34vh;overflow:auto}
.importlist div{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}
.importlist .ok{color:var(--green);font-weight:650}
.importlist .no{color:var(--ink-3)}
.importlist .er{color:var(--red);font-weight:650}

/* toast */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:95;
  background:var(--ink);color:#fff;padding:9px 15px;border-radius:3px;font-size:12.5px;
  box-shadow:var(--shadow);max-width:76vw;
}
.toast[hidden]{display:none}
.toast.bad{background:var(--red)}

/* dialog */
dialog{
  border:1px solid var(--line-2);border-radius:var(--r);padding:0;background:var(--surface);
  max-width:min(760px,92vw);max-height:86vh;box-shadow:var(--shadow);
}
dialog::backdrop{background:rgba(22,33,28,.4)}
dialog .dg-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
dialog .dg-h h3{font-size:13.5px;font-weight:640}
dialog .dg-b{padding:14px 16px;overflow:auto;max-height:70vh;font-size:12.5px;line-height:1.6}
dialog .dg-f{display:flex;gap:8px;justify-content:flex-end;padding:11px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
dialog .dg-b h4{font-size:12.5px;font-weight:640;margin:12px 0 5px}
dialog .dg-b h4:first-child{margin-top:0}
dialog .dg-b ul{margin:5px 0;padding-left:18px}
dialog .dg-b li{margin:2px 0}
dialog .dg-b code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:1px 4px;border-radius:2px}

/* inline controls */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{padding:3px 9px;font-size:12px;color:var(--ink-2);border-left:1px solid var(--line-2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;font-weight:550}
.field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.field input[type=search]{
  height:26px;min-width:170px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);
}
.srcline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <h1>排檢管理台</h1>
      <p>美兆生技客服 · <span id="srcDate">未載入資料</span></p>
    </div>
  </div>
  <div class="topbar-spacer"></div>
  <div class="fresh" id="fresh"><span class="dot"></span><span id="freshText">—</span></div>
  <button class="btn sm" id="syncPill" title="雲端同步">未同步</button>
  <button class="btn primary" id="btnImport">拖入報表更新</button>
  <div class="menu-wrap">
    <button class="btn icon" id="btnMenu" aria-haspopup="true" aria-expanded="false" title="更多">⋯</button>
    <div class="menu" id="menuPanel" hidden>
      <button id="miSync">連線設定（管理者）</button>
      <button id="miExport">匯出離線版 HTML（含目前資料）</button>
      <hr>
      <button id="miBackup">匯出備份（含歷史快照）</button>
      <button id="miRestore">匯入備份</button>
      <hr>
      <button id="miSnapshot">把今天存成快照</button>
      <button id="miSnapshots">管理快照紀錄</button>
      <hr>
      <button id="miClinic">診所代碼命名</button>
      <button id="miHelp">這份儀表板怎麼用</button>
      <button id="miDeploy">怎麼給別人用</button>

        const r = s2[i]; if (!r) continue;
        if (S(r[0]) && S(r[0]) !== '總計') cur = S(r[0]);
        if (!S(r[1])) continue;
        const [c, nm] = splitCode(r[1]);
        out.byClinic.push({ cl: cur, code: c, name: nm, rev: [N(r[2]), N(r[3]), N(r[4]), N(r[5])], chk: [N(r[6]), N(r[7]), N(r[8])], g2: [N(r[9]), N(r[10]), N(r[11])] });
      }
    }
    if (s3) for (let i = 3; i < s3.length; i++) {
      const r = s3[i]; if (!r || !S(r[0])) continue;
      out.detail.push([S(r[0]), S(r[1]), N(r[2]), N(r[3]), S(r[4]), S(r[5]), S(r[6]), S(r[7]), N(r[8]), S(r[9]), N(r[10])]);
    }
    if (s4) for (let i = 2; i < s4.length; i++) {
      const r = s4[i]; if (!r || !S(r[0]) || has(S(r[0]), '總計')) continue;
      const [c, nm] = splitCode(r[0]);
      out.proj66.push({ code: c, name: nm, cells: [N(r[1]), N(r[2]), N(r[3]), N(r[4]), N(r[5]), N(r[6]), N(r[7]), N(r[8])] });
    }
    if (s5) for (let i = 2; i < s5.length; i++) {
      const r = s5[i]; if (!r || !S(r[0])) continue;
      out.proj66detail.push([S(r[0]), N(r[1]), S(r[2]), S(r[3]), S(r[4]), S(r[5])]);
    }
    if (!out.all.length && !out.detail.length) return null;
    return out;
  }

  /* ---------- 已預約資料統計表 ---------- */
  function parseBookedSheet(rows) {
    const out = {}; let curM = null, curSec = null;
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i]; if (!r) continue;
      const m = S(r[0]), sec = S(r[1]), who = S(r[2]);
      if (m) curM = m;
      if (sec) curSec = sec;
      if (!who || !curM || !curSec) continue;
      const g = (k) => N(r[k]);
      const [c, nm] = splitCode(who);
      if (!out[curM]) out[curM] = {};
      if (!out[curM][curSec]) out[curM][curSec] = { rows: [] };
      if (who === '總計') out[curM][curSec].total = [g(3), g(4), g(5), g(6), g(7), g(8), g(11)];
      else if (c.indexOf('cr') === 0) out[curM][curSec].rows.push({ code: c, name: nm, v: [g(3), g(4), g(5), g(6), g(7), g(8), g(11)] });
    }
    return out;
  }

  /* ---------- 六週排檢量警訊 ---------- */
  const WARN_COLS = ['cl','light','date','week','cap','util','quota','openA','extra','dTot','holdT','bkT','rateT','paidT','ratePaidT','unpT','rateUnpT','dMem','holdM','bkM','rateM','paidM','ratePaidM','unpM','rateUnpM','dCorp','holdC','bkC','rateC','paidC','ratePaidC','unpC','rateUnpC'];
  function parseWarn1(rows) {
    const data = [], totals = [];
    for (let i = 7; i < rows.length; i++) {
      const r = rows[i]; if (!r) continue;
      const cl = S(r[0]), dt = S(r[3]);
      const g = (k, num) => (num ? N(r[k]) : S(r[k]));
      const row = [cl, g(2), dt, g(4), g(6,1), g(7), g(8,1), g(10,1), g(13,1),
        g(14,1), g(15,1), g(17,1), g(18), g(19,1), g(20), g(21,1), g(22),
        g(23,1), g(24,1), g(25,1), g(27), g(28,1), g(29), g(30,1), g(31),
        g(33,1), g(34,1), g(35,1), g(36), g(37,1), g(38), g(39,1), g(40)];
      if (/^\d{4}\/\d{2}\/\d{2}$/.test(dt)) data.push(row);
      else if (cl && (has(cl, '總計') || has(cl, '合計'))) totals.push(row);
    }
    return { data, totals };
  }
  function parseWarn2(rows) {
    const out = []; let d = null;
    for (let i = 2; i < rows.length; i++) {
      const r = rows[i]; if (!r) continue;
      if (S(r[0])) d = S(r[0]);
      const fl = S(r[1]); if (!fl) continue;
      const row = [d, fl];
      for (let k = 2; k <= 15; k++) row.push(N(r[k]));
      out.push(row);
    }
    return out;
  }

  /* ---------- 預排業績月報 ---------- */
  function parseMonthly(rows) {
    const months = [S(rows[0][1]), S(rows[0][4]), S(rows[0][7])];
    const out = [];
    for (let i = 3; i < rows.length; i++) {
      const r = rows[i]; if (!r || !S(r[0])) continue;
      const isTot = has(S(r[0]), '總計');
      const [c, nm] = splitCode(r[0]);
      out.push({ code: c, name: nm, tot: isTot, v: [[N(r[1]), N(r[2]), N(r[3])], [N(r[4]), N(r[5]), N(r[6])], [N(r[7]), N(r[8]), N(r[9])]] });
    }
    return { months, rows: out };
  }

  /* ---------- 主入口：一堆檔案 → payload 片段 ---------- */
  async function parseFiles(fileList, base) {
    const patch = {}; const report = [];
    for (const item of fileList) {
      let sheets;
      try {
        sheets = await XL.read(item.buffer);
      } catch (e) { report.push({ name: item.name, status: 'error', msg: e.message }); continue; }
      const found = detect(sheets);
      if (!found.length) { report.push({ name: item.name, status: 'unknown', msg: '認不出是哪一份報表' }); continue; }
      const kinds = found.map(f => f.kind);
      for (const f of found) {
        if (f.kind === 'detail') {
          if (!patch.dicts) patch.dicts = {};
          const r = parseDetail(f.rows, patch.dicts);
          if (f.rows && f.rows[1] && f.rows[1][0]) patch.month = S(f.rows[1][0]);
          patch.biz = r.biz; patch.detail = r.detail; patch.detailCols = r.cols;
        }
        if (f.kind === 'recon') {
          if (!patch._reconSheets) patch._reconSheets = {};
          patch._reconSheets[f.sheet] = f.rows;
        }
        if (f.kind === 'booked') {
          if (!patch.booked) patch.booked = { all: null, byClinic: {} };
          const parsed = parseBookedSheet(f.rows);
          if (f.label === '全') patch.booked.all = parsed; else patch.booked.byClinic[f.label] = parsed;
        }
        if (f.kind === 'warn1') {
          const w = parseWarn1(f.rows);
          patch.warn = patch.warn || {};
          patch.warn.rows = w.data; patch.warn.totals = w.totals;
          patch.warn.statsTime = (function () {
            for (const r of f.rows.slice(0, 3)) for (const c of r) if (typeof c === 'string' && c.indexOf('統計時間') >= 0) return c;
            return '';
          })();
        }
        if (f.kind === 'warn2') {
          patch.warn = patch.warn || {};
          patch.warn.d97 = parseWarn2(f.rows);
        }
        if (f.kind === 'monthly') patch.monthly = parseMonthly(f.rows);
      }
      report.push({ name: item.name, status: 'ok', msg: kinds.join('、') });
    }
    if (patch._reconSheets) { const r = parseRecon(patch._reconSheets); delete patch._reconSheets; if (r) patch.recon = r; }
    return { patch, report };
  }

  return { parseFiles: parseFiles, detect: detect, splitCode: splitCode, T: T, S: S, N: N };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = window.RP;
</script>

<script>
/* ============================================================================

   （各段落共用同一個腳本層級，後面幾段可以直接用這裡的東西）
   ============================================================================ */

/* 明細欄位位置（對應 payload.detailCols） */
const C = { cat:0, unit:1, cl:2, biz:3, n:4, amt:5, d:6, dq:7, att:8, pay:9, sex:10, age:11,
            proj:12, tier:13, card:14, grade:15, cust:16, amt0:17, over3:18, yrs:19, tot:20,

const STORE_KEY = 'paijian.v1';
const $ = (s, r) => (r || document).querySelector(s);

const WD = ['日','一','二','三','四','五','六'];

const DB = {
  D: null,

  view: 'perf',
  clinicName: {},
  prev: null,
  history: [],

/* ---------- 格式化 ---------- */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const num = (n) => (n == null || isNaN(n)) ? '—' : Math.round(n).toLocaleString('en-US');
const wan = (n) => {
  if (n == null || isNaN(n)) return '—';
  const a = Math.abs(n);
  if (a >= 100000000) return (n / 100000000).toFixed(2) + '億';
  if (a >= 10000) return (n / 10000).toFixed(a >= 1000000 ? 0 : 1) + '萬';
  return num(n);
};
const pc = (n) => (n == null || isNaN(n) || !isFinite(n)) ? '—' : (n * 100).toFixed(1) + '%';
const pct0 = (n) => (n == null || isNaN(n) || !isFinite(n)) ? '—' : Math.round(n * 100) + '%';
const signed = (n) => (n > 0 ? '+' : '') + num(n);
const todayISO = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const addDays = (iso, n) => { const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const wdOf = (iso) => { const d = new Date(iso+'T00:00:00'); return isNaN(d) ? '' : WD[d.getDay()]; };
const mdy = (iso) => { const p = String(iso||'').split('-'); return p.length===3 ? (+p[1])+'/'+(+p[2]) : (iso||''); };
const hm = (ts) => { const d = new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
/* 統一的時間顯示：一律轉成使用者本地時間。
   雲端（Supabase）給的是 UTC，直接切字串會少 8 小時，所以一定要走這裡。 */
const fmtTS = (v) => {
  if (v === null || v === undefined || v === '') return '';
  const d = (typeof v === 'number') ? new Date(v) : new Date(String(v));
  if (isNaN(d.getTime())) return String(v).slice(0, 16).replace('T', ' ');
  const p = (x) => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
};

const dict = (name, i) => { const a = (DB.D && DB.D.dicts && DB.D.dicts[name]) || []; return a[i] == null ? '' : a[i]; };
const clName = (code) => DB.clinicName[code] || code;
const bizOf = (i) => (i >= 0 && DB.D && DB.D.biz[i]) ? DB.D.biz[i] : null;
const isBooked = (r) => dict('unit', r[C.unit]) === '2.生技客服';

/* 警訊表的院所名稱（97美兆／台中／高雄）與明細的診所代碼（97／43／04）不同，
   這裡把兩邊合併成一組篩選用的鍵。 */
function warnKey(cl) { return String(cl).replace(/[^\x00-\x7F].*$/, '') || String(cl); }
function clinicKeys() {
  if (!DB.D) return [];
  const keys = [], seen = {};
  ((DB.D.dicts && DB.D.dicts.cl) || []).slice().sort().forEach(function (c) {
    if (!seen[c]) { seen[c] = 1; keys.push({ key: c, label: clName(c) }); }
  });
  ((DB.D.warn && DB.D.warn.rows) || []).forEach(function (r) {
    const k = warnKey(r[0]);
    if (!seen[k]) { seen[k] = 1; keys.push({ key: k, label: r[0] }); }
  });
  return keys;
}
/* 非生技客服的預約（企檢／通路／診所）用排檢單位當顯示名稱 */
function bizLabel(r) {
  const b = bizOf(r[C.biz]);
  if (b) return b.name;
  const u = dict('unit', r[C.unit]).replace(/^\d+\./, '');
  return u || '其他';
}

/* ---------- 表格排序 / 表格內篩選 ---------- */
DB.sort = {};   // { 表格id: { k:欄位, dir:1|-1 } }
DB.tf   = {};   // { 表格id: { 欄位: 值 } }
function sortOf(id, defK, defDir) {
  if (!DB.sort[id]) DB.sort[id] = { k: defK, dir: defDir == null ? -1 : defDir };
  return DB.sort[id];
}
function cmpBy(a, b, k) {
  const x = a[k], y = b[k];
  if (typeof x === 'string' || typeof y === 'string') return String(x == null ? '' : x).localeCompare(String(y == null ? '' : y), 'zh-Hant');
  return (x == null ? -Infinity : x) - (y == null ? -Infinity : y);
}
function sortRows(rows, id) {
  const s = DB.sort[id];
  return s ? rows.slice().sort(function (a, b) { return cmpBy(a, b, s.k) * s.dir; }) : rows.slice();
}
function thSort(id, k, label, cls, title) {
  const s = DB.sort[id] || {};
  const on = s.k === k;
  return '<th class="' + (cls || '') + (on ? ' sorted' : '') + '"><button class="thb" data-sort="' + id + '|' + k + '"' +
    (title ? ' title="' + esc(title) + '"' : '') + '>' + esc(label) + '<span class="ar">' + (on ? (s.dir < 0 ? '▾' : '▴') : '') + '</span></button></th>';
}
function thPlain(label, cls) { return '<th class="' + (cls || '') + '">' + esc(label) + '</th>'; }
function tfv(tbl, field) { return (DB.tf[tbl] && DB.tf[tbl][field]) || ''; }
function tfSelect(tbl, field, label, options, anyLabel) {
  const cur = String(tfv(tbl, field));
  return '<span class="field"><label>' + esc(label) + '</label><select data-tf="' + tbl + '|' + field + '">' +
    '<option value="">' + esc(anyLabel || '全部') + '</option>' +
    options.map(function (o) {
      return '<option value="' + esc(o.v) + '"' + (cur === String(o.v) ? ' selected' : '') + '>' + esc(o.t) + '</option>';
    }).join('') + '</select></span>';
}
function tfSearch(tbl, field, ph) {
  return '<span class="field"><input type="search" data-tf="' + tbl + '|' + field + '" placeholder="' + esc(ph) + '" value="' + esc(tfv(tbl, field)) + '"></span>';
}
/* 核對表／66專案的業務欄是「代碼＋姓名」連在一起，這裡只取前面的代碼來接篩選 */
function codeOf(s) { const m = String(s || '').match(/^[A-Za-z0-9_]+/); return m ? m[0] : String(s || ''); }
function bizIndexByCode(code) { return DB.D.biz.findIndex(function (b) { return b.code === code; }); }
function bizPass(code) {
  if (!DB.filter.biz.size) return true;
  const i = bizIndexByCode(code);
  return i >= 0 && DB.filter.biz.has(i);
}
function clearTf(tbl) { delete DB.tf[tbl]; }

function lampClass(rate) { if (rate == null || isNaN(rate)) return 'none'; return rate >= 0.90 ? 'g' : rate >= 0.70 ? 'y' : 'r'; }
const LAMP = { r:'紅燈', y:'黃燈', g:'綠燈', none:'無資料' };

/* ---------- 儲存：localStorage → IndexedDB → 記憶體 ---------- */
const Mem = {};
const Store = {
  mode: 'mem', tried: false,
  async init() {
    if (this.tried) return; this.tried = true;
    try { localStorage.setItem('__pj','1'); localStorage.removeItem('__pj'); this.mode = 'ls'; return; } catch (e) { }
    try {
      if (typeof indexedDB !== 'undefined') {
        await new Promise(function (res, rej) {
          const rq = indexedDB.open('paijian', 1);
          rq.onupgradeneeded = () => { const db = rq.result; if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
          rq.onsuccess = () => { window.__pjdb = rq.result; res(); };
          rq.onerror = () => rej(rq.error);
          setTimeout(rej, 1500);
        });
        this.mode = 'idb';
      }
    } catch (e) { this.mode = 'mem'; }
  },
  _idb() { return window.__pjdb; },
  async get(k) {
    if (this.mode === 'idb' && window.__pjdb) {
      try { return await new Promise((res, rej) => { const t = window.__pjdb.transaction('kv','readonly').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); } catch (e) { this.mode = 'mem'; }
    }
    if (this.mode === 'ls') { try { const v = localStorage.getItem(STORE_KEY+':'+k); return v ? JSON.parse(v) : undefined; } catch (e) { } }
    return Mem[k];
  },
  async set(k, v) {
    if (this.mode === 'idb' && window.__pjdb) {
      try { await new Promise((res, rej) => { const tx = window.__pjdb.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return; } catch (e) { this.mode = 'mem'; }
    }
    if (this.mode === 'ls') { try { localStorage.setItem(STORE_KEY+':'+k, JSON.stringify(v)); return; } catch (e) { this.mode = 'mem'; } }
    Mem[k] = v;
  },
  async del(k) {
    if (this.mode === 'idb' && window.__pjdb) { try { await new Promise((res) => { const tx = window.__pjdb.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = res; tx.onerror = res; }); return; } catch (e) { } }
    if (this.mode === 'ls') try { localStorage.removeItem(STORE_KEY+':'+k); } catch (e) { }
    delete Mem[k];
  },
  label() { return this.mode === 'idb' ? '瀏覽器資料庫' : this.mode === 'ls' ? '本機儲存' : '本次工作階段（重開會清空）'; }
};

/* ---------- 篩選 ---------- */
function detailRows() {
  const D = DB.D; if (!D || !D.detail) return [];
  const f = DB.filter, dic = D.dicts;
  const anyBiz = f.biz.size > 0, anyCl = f.clinic.size > 0;
  if (!anyBiz && !anyCl) return D.detail;
  const out = [];
  for (let i = 0; i < D.detail.length; i++) {
    const r = D.detail[i];
    if (anyBiz && !(r[C.biz] >= 0 && f.biz.has(r[C.biz]))) continue;
    if (anyCl && !f.clinic.has(dic.cl[r[C.cl]])) continue;
    out.push(r);
  }
  return out;
}
/* 有沒有載入任何明細資料（空白版匯出、或第一次使用時會是空的） */
function hasData() { return !!(DB.D && DB.D.detail && DB.D.detail.length); }
function monthMismatch() { return false; }  // 不再顯示月份不匹配警告

/* ---------- 每月業績（預排月報） ---------- */
function monthlyFor(month) {
  const m = DB.D && DB.D.monthly; if (!m) return null;
  const mi = m.months.indexOf(month); if (mi < 0) return null;
  const bs = DB.filter.biz, B = DB.D.biz, out = [];
  m.rows.forEach(function (row) {
    if (row.tot) return;
    const bi = B.findIndex(x => x.code === row.code);
    if (bs.size && !(bi >= 0 && bs.has(bi))) return;
    out.push({ code: row.code, name: row.name, target: row.v[mi][0], booked: row.v[mi][1], rate: row.v[mi][2] / 100 });
  });
  const tot = { target:0, booked:0 };
  out.forEach(x => { tot.target += x.target; tot.booked += x.booked; });
  tot.rate = tot.target ? tot.booked / tot.target : 0;
  return { rows: out, tot: tot };
}
/* 已預約統計表：取某月某區段的各業務數字 */
function bookedFor(month, section, clinicKey) {
  const B = DB.D && DB.D.booked; if (!B) return null;
  const src = (!clinicKey || clinicKey === '全') ? B.all : (B.byClinic || {})[clinicKey];
  if (!src || !src[month]) return null;
  const node = src[month][section]; if (!node) return null;
  const bs = DB.filter.biz, BZ = DB.D.biz, rows = [];
  (node.rows || []).forEach(function (r) {
    const bi = BZ.findIndex(x => x.code === r.code);
    if (bs.size && !(bi >= 0 && bs.has(bi))) return;
    rows.push({ code:r.code, name:r.name, v:r.v });
  });
  const tot = [0,0,0,0,0,0,0];
  rows.forEach(r => r.v.forEach((x,i) => tot[i] += x));
  return { rows: rows, total: tot, raw: node.total || null };
}


/* 比較兩份 keyed snapshot（通用邏輯，母檔明細與核對表明細共用）
   valueFields: 值字串裡各欄位的名稱與位置 [{i, label}]
   回傳 { added, removed, changes: [{k, field, from, to}], info } */
function compareKeyedSnapshots(prev, cur, valueFields) {
  if (!prev || !prev.recs || !cur || !cur.recs) return null;
  const added = [], removed = [], changes = [];
  const left = new Set();
  for (const k in prev.recs) left.add(k);
  for (const k in cur.recs) {
    const A = prev.recs[k], B = cur.recs[k];
    if (A === undefined) { added.push(k); continue; }
    if (A !== B) {
      const a = A.split('|'), b = B.split('|');
      valueFields.forEach(function (vf) {
        if (a[vf.i] !== b[vf.i]) {
          changes.push({ k: k, field: vf.label, from: +a[vf.i], to: +b[vf.i] });
        }
      });
    }
    left.delete(k);
  }
  left.forEach(function (k) { removed.push(k); });
  const allMeta = Object.assign({}, prev.meta || {}, cur.meta || {});
  function info(k) {
    const ms = String(allMeta[k] || '').split('|');
    return { clinic: ms[0] || '—', extra: ms[1] || '', biz: k.split('|')[0] || '—', key: k };
  }
  return { added: added, removed: removed, changes: changes, info: info };
}

/* ---------- 業績核對表 工作表3（明細）的快照 ---------- */
/* 身分：業務 + 客戶編號+序號 + 分類 + 項目 + 級數 + 全檢類別
   值：業績 | 檢次 | 二代獎金
   不含金額在身分裡，所以業績變動會顯示成「業績被改」而不是「取消＋新增」。 */
function buildReconDetailSnapshot(D) {
  if (!D.recon || !D.recon.detail || !D.recon.detail.length) return null;
  const groups = {};
  for (const r of D.recon.detail) {
    const bk = r[0] + '|' + r[4] + '|' + r[1] + '|' + r[6] + '|' + r[7] + '|' + (r[9] || '');
    (groups[bk] || (groups[bk] = [])).push(r);
  }
  const recs = {}, meta = {};
  Object.keys(groups).forEach(function (bk) {
    const items = groups[bk].map(function (r) {
      return { r: r, v: Math.round(r[2] || 0) + '|' + Math.round(r[8] || 0) + '|' + Math.round(r[10] || 0) };
    });
    items.sort(function (a, b) { return a.v < b.v ? -1 : a.v > b.v ? 1 : 0; });
    items.forEach(function (x, i) {
      const k = i === 0 ? bk : bk + '#' + i;
      recs[k] = x.v;
      meta[k] = (x.r[5] || '') + '|' + (x.r[3] || '');   // 診所 | 加選&官網%
    });
  });
  return { recs: recs, meta: meta, n: D.recon.detail.length };
}


/* ---------- 業績核對表 工作表1（各業務營業額）的快照 ---------- */
function buildReconSummarySnapshot(D) {
  if (!D.recon || !D.recon.all) return null;
  const out = {};
  D.recon.all.forEach(function (r) {
    out[r.code] = {
      name: r.name,
      p_full: r.rev[0] || 0, p_add: r.rev[1] || 0, p_ret: r.rev[2] || 0, p_total: r.rev[3] || 0,
      p_g1: r.chk[0] || 0, p_g2: r.chk[1] || 0, p_gTotal: r.chk[2] || 0
    };
  });
  return out;
}

function compareReconSummary(prev, cur) {
  if (!prev || !cur) return null;
  const changes = [];
  const allCodes = new Set();
  Object.keys(prev).forEach(function (c) { allCodes.add(c); });
  Object.keys(cur).forEach(function (c) { allCodes.add(c); });
  allCodes.forEach(function (code) {
    const p = prev[code] || { name:'', p_total:0, p_full:0, p_add:0, p_g1:0, p_g2:0 };
    const c = cur[code] || { name:'', p_total:0, p_full:0, p_add:0, p_g1:0, p_g2:0 };
    const dt = (c.p_total||0) - (p.p_total||0);
    const df = (c.p_full||0) - (p.p_full||0);
    const dj = (c.p_add||0) - (p.p_add||0);
    const dg1 = (c.p_g1||0) - (p.p_g1||0);
    const dg2 = (c.p_g2||0) - (p.p_g2||0);
    if (dt !== 0 || df !== 0 || dj !== 0 || dg1 !== 0 || dg2 !== 0) {
      changes.push({
        code: code, name: c.name || p.name,
        p_total: p.p_total||0, c_total: c.p_total||0, dt: dt,
        p_full: p.p_full||0, c_full: c.p_full||0, df: df,
        p_add: p.p_add||0, c_add: c.p_add||0, dj: dj,
        p_g1: p.p_g1||0, c_g1: c.p_g1||0, dg1: dg1,
        p_g2: p.p_g2||0, c_g2: c.p_g2||0, dg2: dg2
      });
    }
  });
  return changes;
}

/* ---------- 已預約統計表 工作表1（各業務預約）的快照 ---------- */
function buildBookedSummarySnapshot(D) {
  if (!D.booked || !D.booked.all) return null;
  const out = {};
  Object.keys(D.booked.all).forEach(function (m) {
    Object.keys(D.booked.all[m]).forEach(function (s) {
      const node = D.booked.all[m][s];
      const key = m + '|' + s;
      out[key] = {
        total: node.total || [],
        rows: (node.rows || []).map(function (r) {
          return { code: r.code, name: r.name, v: r.v };
        })
      };
    });
  });
  return out;
}

/* 比較兩份 bookedSummary：只比 A:預約 */
function compareBookedSummary(prev, cur) {
  if (!prev || !cur) return null;
  const changes = [];
  const allKeys = new Set();
  Object.keys(prev).forEach(function (k) { if (k.endsWith('|A:預約')) allKeys.add(k); });
  Object.keys(cur).forEach(function (k) { if (k.endsWith('|A:預約')) allKeys.add(k); });
  allKeys.forEach(function (key) {
    const p = prev[key] || { rows: [], total: [] };
    const c = cur[key] || { rows: [], total: [] };
    const byCode = {};
    p.rows.forEach(function (r) { byCode[r.code] = { p: r, c: null }; });
    c.rows.forEach(function (r) {
      if (!byCode[r.code]) byCode[r.code] = { p: null, c: r };
      else byCode[r.code].c = r;
    });
    Object.keys(byCode).forEach(function (code) {
      const x = byCode[code];
      const pv = x.p ? x.p.v : [0,0,0,0,0,0,0];
      const cv = x.c ? x.c.v : [0,0,0,0,0,0,0];
      const d_cnt = (cv[2]||0) - (pv[2]||0);
      const d_rev = (cv[6]||0) - (pv[6]||0);
      if (d_cnt !== 0 || d_rev !== 0) {
        changes.push({
          code: code, name: (x.c && x.c.name) || (x.p && x.p.name) || code,
          month: key.split('|')[0],
          p_cnt: pv[2]||0, c_cnt: cv[2]||0, d_cnt: d_cnt,
          p_rev: pv[6]||0, c_rev: cv[6]||0, d_rev: d_rev
        });
      }
    });
  });
  return changes;
}

/* ---------- 月報（各業務達成率）的快照 ---------- */
function buildMonthlySummarySnapshot(D) {
  if (!D.monthly || !D.monthly.rows) return null;
  return {
    months: D.monthly.months,
    rows: D.monthly.rows.map(function (r) {
      return { code: r.code, name: r.name, tot: r.tot, v: r.v };
    })
  };
}

function compareMonthlySummary(prev, cur) {
  if (!prev || !cur) return null;
  const changes = [];
  const byCode = {};
  prev.rows.forEach(function (r) { if (!r.tot) byCode[r.code] = { p: r, c: null }; });
  cur.rows.forEach(function (r) {
    if (r.tot) return;
    if (!byCode[r.code]) byCode[r.code] = { p: null, c: r };
    else byCode[r.code].c = r;
  });
  Object.keys(byCode).forEach(function (code) {
    const x = byCode[code];
    if (!x.p || !x.c) return;
    for (let mi = 0; mi < 3; mi++) {
      const pa = x.p.v[mi] || [0,0,0];
      const ca = x.c.v[mi] || [0,0,0];
      const da = (ca[1]||0) - (pa[1]||0);
      const dr = (ca[2]||0) - (pa[2]||0);
      if (da !== 0 || dr !== 0) {
        changes.push({
          code: code, name: x.c.name || x.p.name,
          month: cur.months[mi] || '',
          p_booked: pa[1]||0, c_booked: ca[1]||0, d_booked: da,
          p_rate: pa[2]||0, c_rate: ca[2]||0, d_rate: dr
        });
      }
    }
  });
  return changes;
}

/* ---------- 快照 ---------- */
/* 一筆紀錄的「身分」：卡號+序號、類別、級數、項目。
   刻意不含金額——金額會隨繳費狀態變動，放進身分會讓同一筆被誤判成「取消＋新增」。 */
function recordKey(r) { return r[C.key] + '|' + r[C.cat] + '|' + r[C.lvl] + '|' + r[C.item]; }
/* 會變動的欄位，放在「值」裡面比對 */
function recordVal(r) {
  return (r[C.att] ? 1 : 0) + '' + (r[C.pay] ? 1 : 0) + '|' + Math.round(r[C.amt]) + '|' + r[C.d] + '|' + r[C.dq] + '|' + r[C.biz];
}
/* 只為了顯示的欄位（不參與比對）。取消的那筆在「目前資料」裡已經不存在，
   所以要跟著快照一起存，否則清單上只會看到「已不在本期名單」。 */
function recordMeta(D, r) {
  const b = (r[C.biz] >= 0 && D.biz && D.biz[r[C.biz]]) ? D.biz[r[C.biz]] : null;
  const dic = D.dicts || {};
  const clCode = (dic.cl || [])[r[C.cl]] || '';
  const catName = (dic.cat || [])[r[C.cat]] || '';
  let unit = (dic.unit || [])[r[C.unit]] || '';
  unit = unit.replace(/^\d+\./, '');
  return [r[C.cust] || '', (DB.clinicName && DB.clinicName[clCode]) || clCode, catName, b ? b.name : (unit || '其他')].join('|');
}

const SNAP_V = 2;   // 快照格式版本：換版時舊快照不能直接比，要重新建立基準

function buildSnapshot(D, label) {
  /* 先用「身分」分組，再用值排序後編號。
     同一張卡、同類別、同級數、同項目可能有多筆（重複加選），
     排序後編號可確保 Excel 每次匯出的列順序不同也不會影響比對結果。 */
  const groups = {};
  for (const r of D.detail) {
    const k = recordKey(r);
    (groups[k] || (groups[k] = [])).push(r);
  }
  const recs = {}, meta = {};
  Object.keys(groups).forEach(function (bk) {
    // 先比「不會變」的欄位（檢日、預約日），再比值。
    // 只用值排序的話，金額一改就可能跟同組的另一筆對調位置，造成兩筆都被回報成變動。
    const items = groups[bk].map(function (r) { return { r: r, v: recordVal(r), s: r[C.d] + '|' + r[C.dq] }; });
    items.sort(function (a, b) {
      if (a.s !== b.s) return a.s < b.s ? -1 : 1;
      return a.v < b.v ? -1 : a.v > b.v ? 1 : 0;
    });
    items.forEach(function (x, i) {
      const k = i === 0 ? bk : bk + '#' + i;
      recs[k] = x.v;
      meta[k] = recordMeta(D, x.r);
    });
  });
  const bizAgg = {};
  for (const r of D.detail) {
    if (!isBooked(r) || r[C.biz] < 0) continue;
    const c = D.biz[r[C.biz]].code;
    if (!bizAgg[c]) bizAgg[c] = { amt:0, cnt:0 };
    bizAgg[c].amt += r[C.amt]; bizAgg[c].cnt += 1;
  }
  let amt = 0, cnt = 0, paid = 0, att = 0;
  for (const r of D.detail) { amt += r[C.amt]; cnt += 1; if (r[C.pay]) paid++; if (r[C.att]) att++; }
  return { v:SNAP_V, label:label||'', date:todayISO(), ts:Date.now(), n:D.detail.length, month:D.month,
           recs:recs, meta:meta, bizAgg:bizAgg, kpi:{ amt:amt, cnt:cnt, paid:paid, att:att },
           reconDetail: buildReconDetailSnapshot(D),
           reconSummary: buildReconSummarySnapshot(D),
           bookedSummary: buildBookedSummarySnapshot(D),
           monthlySummary: buildMonthlySummarySnapshot(D) };
}


/* ========== 業績計算引擎 ========== */

/* 全檢獎金級距計算 */
function calculateFullCheckBonus(totalFullCheckRevenue) {
    const threshold = 250000;
    const deduction = Math.max(0, totalFullCheckRevenue - threshold);

    if (totalFullCheckRevenue >= 1000000) {
        return (deduction - threshold) * 0.10 + threshold * 0.035;
    } else if (totalFullCheckRevenue >= 750000) {
        return (deduction - threshold) * 0.07 + threshold * 0.035;
    } else if (totalFullCheckRevenue >= 500000) {
        return (deduction - threshold) * 0.05 + threshold * 0.035;
    } else if (totalFullCheckRevenue >= 250000) {
        return deduction * 0.035;
    }
    return 0;
}

/* 66 專案加碼計算 */
function calculate66Bonus(revenue, clinic) {
    if (clinic === '97') {
        return revenue * 0.01;
    } else {
        return revenue * 0.02;
    }
}

/* 中高加碼計算 */
function calculateMidHighBonus(category, revenue, clinic) {
    if (category === '1.全檢') {
        if (clinic === '43') return revenue * 0.015;
        if (clinic === '04' || clinic === '4') return revenue * 0.02;
    }
    return 0;
}

/* 官網&加選獎金計算 */
function calculateOfficialAddOnBonus(percentage, revenue) {
    return percentage * revenue * 0.01;
}

/* 判斷是否為全檢類別 */
function isFullCheck(category) {
    return category === '1.一代' || category === '2.二代' || category === '3.二代 LuxB' || 
           category === '4.MPA' || category === '5.LuxB' || category === '9.IGg4';
}

/* 判斷是否為加選類別 */
function isAddOn(category) {
    return category === 'a.其他加選' || category === 'b.二代 LuxP' || category === 'c.LuxP' || category === 'd.二代';
}

/* 從業績核對表計算每位業務的獎金 */
function calculateCommission(D) {
    // 使用業績核對表 工作表3 的資料（有 加選&官網% 欄位）
    if (!D || !D.recon || !D.recon.detail || D.recon.detail.length === 0) return null;

    const byStaff = {};

    D.recon.detail.forEach(function (r) {
        // r: [業務，分類，業績，加選&官網%, 客戶編號+序號，診所，項目，級數，檢次，全檢類別，二代獎金]
        const bizCode = r[0];  // e.g., "cr03 劉恩娜"
        if (!bizCode || !bizCode.startsWith('cr')) return;

        // 解析業務代碼和姓名
        let code = bizCode, name = '';
        for (let i = 0; i < bizCode.length; i++) {
            if (bizCode[i] >= '\u4e00' && bizCode[i] <= '\u9fff') {
                code = bizCode.substring(0, i);
                name = bizCode.substring(i);
                break;
            }
        }
        if (!byStaff[code]) {
            byStaff[code] = {
                code: code,
                name: name,
                fullCheckRevenue: 0,  // 全檢業績
                addOnRevenue: 0,       // 加選業績
                secondGenBonus: 0,     // 二代獎金
                midHighBonus: 0,       // 中高加碼
                officialAddOnBonus: 0, // 官網&加選獎金
                project66Bonus: 0,     // 66 專案加碼
                records: []
            };
        }

        const category = r[1] || '';   // 1.全檢, 2.加選, 5.診所回歸
        const revenue = Number(r[2]) || 0;
        const addOnPct = Number(r[3]) || 0;  // 加選&官網%
        const clinic = r[5] || '';     // 診所代碼 (97, 04, 43)
        const fullCheckType = r[9] || '';  // 1.一代，2.二代
        const secondGenBonus = Number(r[10]) || 0;  // 二代獎金 (50, 150, 0)

        // 累計業績
        if (category === '1.全檢') {
            byStaff[code].fullCheckRevenue += revenue;
        } else if (category === '2.加選') {
            byStaff[code].addOnRevenue += revenue;
        }

        // 計算各項獎金
        byStaff[code].secondGenBonus += secondGenBonus;
        byStaff[code].midHighBonus += calculateMidHighBonus(category, revenue, clinic);
        byStaff[code].officialAddOnBonus += calculateOfficialAddOnBonus(addOnPct, revenue);
        byStaff[code].project66Bonus += calculate66Bonus(revenue, clinic);

        byStaff[code].records.push({
            category, clinic, revenue, addOnPct, secondGenBonus
        });
    });

    // 計算全檢獎金（級距%）
    Object.keys(byStaff).forEach(function (code) {
        const staff = byStaff[code];
        staff.fullCheckBonus = calculateFullCheckBonus(staff.fullCheckRevenue);
        staff.fullCheckDeduction = Math.max(0, staff.fullCheckRevenue - 250000);
        staff.totalBonus = staff.fullCheckBonus + staff.officialAddOnBonus +
                          staff.secondGenBonus + staff.project66Bonus + staff.midHighBonus;
    });

    return Object.values(byStaff).sort(function (a, b) { return b.totalBonus - a.totalBonus; });
}

/* 快照中加入 commission 資料 */
const _origBuildSnapshot = buildSnapshot;
buildSnapshot = function (D, label) {
    const snap = _origBuildSnapshot(D, label);
    snap.commission = calculateCommission(D);
    return snap;
};

function compareSnapshot(prev, cur) {
  if (!prev || !prev.recs || !cur || !cur.recs) return null;
  const bizOfCode = function (c) { const b = DB.D && DB.D.biz ? DB.D.biz.find(function (x) { return x.code === c; }) : null; return b ? b.name : c; };
  const bizDelta = [];
  (function () {
    const codes = {};
    Object.keys(cur.bizAgg || {}).forEach(function (c) { codes[c] = 1; });
    Object.keys((prev && prev.bizAgg) || {}).forEach(function (c) { codes[c] = 1; });
    Object.keys(codes).forEach(function (c) {
      const p = (prev.bizAgg && prev.bizAgg[c]) || { amt:0, cnt:0 };
      const q = (cur.bizAgg && cur.bizAgg[c]) || { amt:0, cnt:0 };
      bizDelta.push({ code:c, name:bizOfCode(c), amt:q.amt-p.amt, cnt:q.cnt-p.cnt, nowAmt:q.amt, nowCnt:q.cnt, prevAmt:p.amt, prevCnt:p.cnt });
    });
    bizDelta.sort(function (a, b) { return a.amt - b.amt; });
  })();

  const empty = { added:[], removed:[], attCh:[], payCh:[], amtCh:[], bizDelta:bizDelta, info:function(){ return { cust:'（無資料）', biz:'—', cl:'—', cat:'—', amt:0, d:'', dq:'' }; } };

  // 舊格式的快照（key 算法不同）不能直接比，第一次匯入後就會自動建立新基準
  if (prev.v !== cur.v) {
    return Object.assign({}, empty, {
      prevLabel:prev.label, prevDate:prev.date, prevTs:prev.ts, curDate:cur.date, n:cur.n,
      overlap:0, comparable:false, staleFormat:true
    });
  }

  const added = [], removed = [], attCh = [], payCh = [], amtCh = [];
  const left = new Set();
  for (const k in prev.recs) left.add(k);
  for (const k in cur.recs) {
    const A = prev.recs[k], B = cur.recs[k];
    if (A === undefined) { added.push(k); continue; }
    if (A !== B) {
      const a = A.split('|'), b = B.split('|');
      if (a[0][0] !== b[0][0]) attCh.push([k, a[0][0] === '1', b[0][0] === '1']);
      if (a[0][1] !== b[0][1]) payCh.push([k, a[0][1] === '1', b[0][1] === '1']);
      if (a[1] !== b[1]) amtCh.push([k, +a[1], +b[1]]);
    }
    left.delete(k);
  }
  left.forEach(function (k) { removed.push(k); });

  /* 兩邊的資料都拿來查，取消的那筆才顯示得出是誰 */
  const allVals = Object.assign({}, prev.recs, cur.recs);
  const allMeta = Object.assign({}, prev.meta || {}, cur.meta || {});
  function info(k) {
    const base = k.split('#')[0];
    const vs = allVals[k] != null ? allVals[k] : allVals[base];
    const ms = allMeta[k] != null ? allMeta[k] : allMeta[base];
    const v = String(vs == null ? '' : vs).split('|');
    const m = String(ms == null ? '' : ms).split('|');
    // 值的格式：att+pay | 金額 | 檢日 | 預約日 | 業務索引
    return { cust:m[0] || '（無資料）', cl:m[1] || '—', cat:m[2] || '—', biz:m[3] || '—',
             amt:+v[1] || 0, d:v[2] || '', dq:v[3] || '' };
  }

  // 摘要報表比較（獨立於母檔，不受 staleFormat 影響）
  const reconDetail = compareKeyedSnapshots(prev.reconDetail, cur.reconDetail,
    [{i:0, label:'業績'},{i:1, label:'檢次'},{i:2, label:'二代獎金'}]);
  const reconSummary = compareReconSummary(prev.reconSummary, cur.reconSummary);
  const bookedSummary = compareBookedSummary(prev.bookedSummary, cur.bookedSummary);
  const monthlySummary = compareMonthlySummary(prev.monthlySummary, cur.monthlySummary);

  // 兩份快照若不是同一批資料（例如換了月份、匯入的檔案涵蓋不同日期），
  // 逐筆比對會把整份名單都判成「新增」，這時改用彙總差異來說明。
  const overlap = cur.n ? (cur.n - added.length) / cur.n : 0;
  const sameMonth = !prev.month || !cur.month || prev.month === cur.month;
  const comparable = sameMonth && overlap >= 0.5;
  return { prevLabel:prev.label, prevDate:prev.date, prevTs:prev.ts, curDate:cur.date, n:cur.n,
           overlap:overlap, comparable:comparable,
           added:added, removed:removed, attCh:attCh, payCh:payCh, amtCh:amtCh, bizDelta:bizDelta, info:info,
           reconDetail: reconDetail, reconSummary: reconSummary,
           bookedSummary: bookedSummary, monthlySummary: monthlySummary };
}

/* ---------- 匯入：把 patch 併進目前的資料 ---------- */
function applyPatch(patch) {
  const D = DB.D;
  ['biz','detail','detailCols','dicts','month','monthly'].forEach(function (k) { if (patch[k] != null) D[k] = patch[k]; });
  if (patch.recon) D.recon = patch.recon;
  if (patch.booked) {
    D.booked = D.booked || { all:{}, byClinic:{} };
    if (patch.booked.all) D.booked.all = patch.booked.all;
    Object.keys(patch.booked.byClinic || {}).forEach(k => D.booked.byClinic[k] = patch.booked.byClinic[k]);
  }
  if (patch.warn) {
    D.warn = D.warn || {};
    if (patch.warn.rows) { D.warn.rows = patch.warn.rows; D.warn.totals = patch.warn.totals || D.warn.totals; }
    if (patch.warn.d97) D.warn.d97 = patch.warn.d97;
    if (patch.warn.statsTime) D.warn.statsTime = patch.warn.statsTime;
  }
}

/* ---------- 小元件 ---------- */
function bar(v, cls) {
  const w = Math.max(0, Math.min(1.5, v || 0));
  return '<div class="bar"><i class="' + (cls || (v >= 0.9 ? '' : v >= 0.7 ? 'warn' : 'bad')) + '" style="width:' + (w * 100 / 1.5) + '%"></i></div>';
}
function barWrap(v) { return '<div class="bar-wrap"><span class="pc">' + pct0(v) + '</span>' + bar(v) + '</div>'; }
function lamp(rate) { const c = lampClass(rate); return '<span class="lamp ' + (c === 'none' ? 'none' : c) + '" title="' + LAMP[c] + '"></span>'; }
function tag(text, cls) { return '<span class="tag ' + (cls||'n') + '">' + esc(text) + '</span>'; }
function panel(title, sub, bodyHtml, right) {
  return '<div class="panel"><div class="panel-h"><h3>' + esc(title) + '</h3>' +
    (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') +
    (right ? '<div class="right">' + right + '</div>' : '') +
    '</div><div class="panel-b">' + bodyHtml + '</div></div>';
}
function panelPad(title, bodyHtml, right) {
  return '<div class="panel"><div class="panel-h"><h3>' + esc(title) + '</h3>' +
    (right ? '<div class="right">' + right + '</div>' : '') + '</div>' + bodyHtml + '</div>';
}
/* 表格的 CSV 匯出：各頁把匯出函式註冊進來，按鈕只要掛 data-csv="id" */
const CSV_EXPORTS = {};
function csvBtn(id, label) { return '<button class="btn sm" data-csv="' + id + '">' + esc(label || '匯出 CSV') + '</button>'; }
function saveCsv(id, filename) {
  const f = CSV_EXPORTS[id];
  if (!f) { toast('這個表還沒有匯出功能', true); return; }
  download(new Blob([f()], { type: 'text/csv;charset=utf-8' }), filename || (id + '.csv'));
  toast('已匯出 CSV');
}
function emptyBox(title, text) { return '<div class="empty"><b>' + esc(title) + '</b>' + esc(text) + '</div>'; }
function notice(text, cls) { return '<div class="notice ' + (cls||'') + '">' + text + '</div>'; }

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, bad ? 6000 : 3600);
}
function openDlg(title, bodyHtml, footHtml) {
  $('#dlgTitle').textContent = title;
  $('#dlgBody').innerHTML = bodyHtml;
  const f = $('#dlgFoot');
  if (footHtml) { f.innerHTML = footHtml; f.hidden = false; } else { f.innerHTML = ''; f.hidden = true; }
  const d = $('#dlg'); if (!d.open) d.showModal();
}
</script>

<script>
/* ============================================================================
   VIEWS A — KPI、篩選列、分頁，以及「業績／排檢狀況／排檢量警訊」三頁
   ============================================================================ */

/* ---------- SVG 圖表小工具 ---------- */
function vbars(items, opts) {
  // items: [{label, sub, segs:[{v,cls,title}], total, note}]
  opts = opts || {};
  const H = opts.height || 150, padB = opts.padB || 26, padT = 14, gap = opts.gap || 5;
  const w = Math.max(240, items.length * (opts.col || 26));
  const max = Math.max(1, ...items.map(i => i.segs.reduce((a, s) => a + s.v, 0)));
  const plot = H - padB - padT;
  let x = 0, out = '';
  items.forEach(function (it) {
    const bw = Math.max(6, (w / items.length) - gap);
    let y = padT + plot;
    it.segs.forEach(function (s) {
      if (s.v <= 0) return;
      const h = Math.max(0, s.v / max * plot);
      y -= h;
      out += '<rect x="' + (x + gap / 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) +
             '" fill="var(--' + (s.cls || 'brand') + ')" opacity="' + (s.op == null ? 1 : s.op) + '"><title>' + esc(s.title || '') + '</title></rect>';
    });
    if (it.label) out += '<text x="' + (x + gap / 2 + bw / 2).toFixed(1) + '" y="' + (H - 14) + '" text-anchor="middle">' + esc(it.label) + '</text>';
    if (it.sub) out += '<text x="' + (x + gap / 2 + bw / 2).toFixed(1) + '" y="' + (H - 3) + '" text-anchor="middle" style="fill:var(--ink-3);font-size:9.5px">' + esc(it.sub) + '</text>';
    x += w / items.length;
  });
  out += '<line class="ax" x1="0" y1="' + (padT + plot) + '" x2="' + w + '" y2="' + (padT + plot) + '"/>';
  return '<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ' + w + ' ' + H + '" width="' + w + '" height="' + H + '">' + out + '</svg></div>';
}

function stackedBar(parts) {
  // 單條 100% 堆疊
  const tot = parts.reduce((a, p) => a + p.v, 0) || 1;
  let inner = '', legend = '';
  parts.forEach(function (p, i) {
    const w = p.v / tot * 100;
    inner += '<i style="position:absolute;left:' + (i === 0 ? 0 : '0') + ';width:' + w + '%;background:var(--' + (p.cls || 'brand') + ')" title="' + esc(p.label + ' ' + num(p.v)) + '"></i>';
    legend += '<span><i style="background:var(--' + (p.cls || 'brand') + ')"></i>' + esc(p.label) + ' <b class="num" style="font-weight:600">' + wan(p.v) + '</b></span>';
  });
  // 以 flex 疊放，避免絕對定位互相覆蓋
  let flex = '<div style="display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-3)">';
  parts.forEach(function (p) {
    const w = p.v / tot * 100;
    if (w <= 0) return;
    flex += '<span style="width:' + w + '%;background:var(--' + (p.cls || 'brand') + ')" title="' + esc(p.label + ' ' + num(p.v)) + '"></span>';
  });
  flex += '</div>';
  return flex + '<div class="legend">' + legend + '</div>';
}

/* ---------- KPI ---------- */
function computeKpis() {
  const D = DB.D, rows = detailRows(), today = todayISO(), mo = DB.filter.month || D.month;
  const k = {};

  // 1 業績（預排月報：個檢）
  const mf = monthlyFor(mo);
  k.perf = mf ? mf.tot : null;

  // 2 & 3 預約檢次 / 到檢率（已預約統計表）
  const bkA = bookedFor(mo, 'A:預約', '全') || (DB.filter.clinic.size === 1 ? bookedFor(mo, 'A:預約', Array.from(DB.filter.clinic)[0]) : null);
  const bkC = bookedFor(mo, 'C:到撿', '全');
  k.bookA = bkA ? bkA.total : null;
  k.bookC = bkC ? bkC.total : null;
  
  // 計算一代/二代比例
  if (bkA && bkA.total && bkA.total[2]) {
    const total = bkA.total[2];
    k.gen1Pct = Math.round((bkA.total[0] / total) * 100);
    k.gen2Pct = Math.round((bkA.total[1] / total) * 100);
  }

  // 4 全台排檢率（六週警訊）
  const W = D.warn && D.warn.rows ? D.warn.rows : [];
  let red = 0, yellow = 0;
  const byCl = {};
  W.forEach(function (r) {
    const dt = r[2];
    const t = r[11], a = r[7];
    const rate = a > 0 ? t / a : null;
    const c = lampClass(rate);
    if (dt >= today) { if (c === 'r') red++; else if (c === 'y') yellow++; }
    const cl = r[0];
    if (!byCl[cl]) byCl[cl] = { booked:0, open:0, quota:0, red:0, yellow:0, days:0 };
    if (dt >= today) { byCl[cl].booked += t; byCl[cl].open += a; byCl[cl].days++; }
  });
  k.warnRed = red; k.warnYellow = yellow; k.warnByCl = byCl;

  // 5 未來 N 天待檢
  const to = addDays(today, DB.watchDays);
  k.watch = { n:0, unpaid:0, amt:0, byBiz:{} };
  rows.forEach(function (r) {
    const d = r[C.d];
    if (d >= today && d <= to && !r[C.att]) {
      k.watch.n++;
      if (!r[C.pay]) k.watch.unpaid++;
      k.watch.amt += r[C.amt];
      const b = bizOf(r[C.biz]); const key = b ? b.name : '其他';
      k.watch.byBiz[key] = (k.watch.byBiz[key] || 0) + 1;
    }
  });

  // 6 異動
  const y = addDays(today, -1), dqFrom = addDays(today, -7);
  let newToday = 0, newWeek = 0;
  rows.forEach(r => { if (r[C.dq] === y) newToday++; if (r[C.dq] >= dqFrom && r[C.dq] <= today) newWeek++; });
  k.newPrev = newToday; k.newWeek = newWeek;
  k.delta = DB.delta;
  return k;
}

function renderKpis() {
  if (typeof hasData === 'function' && !hasData()) {
    $('#kpis').innerHTML = '<div class="kpi" style="grid-column:1/-1">' +
      '<div class="k-label">還沒有資料</div>' +
      '<div class="k-val" style="font-size:16px">把每天的報表拖進這個視窗</div>' +
      '<div class="k-foot">xlsx 直接拖進來就會自己辨識。也可以從「⋯ → 雲端同步設定」抓其他裝置上傳的資料。</div></div>';
    return;
  }
  const k = computeKpis();
  const tiles = [];
  // 1 業績
  if (k.perf) {
    tiles.push({
      label: '本月業績 <span style="color:var(--ink-3)">個檢</span>',
      val: wan(k.perf.booked),
      foot: '目標 ' + wan(k.perf.target) + ' · 達成 <b>' + pct0(k.perf.rate) + '</b>',
      cls: k.perf.rate >= 0.9 ? 'good' : k.perf.rate >= 0.7 ? '' : 'warn'
    });
  } else tiles.push({ label:'本月業績', val:'—', foot:'沒有預排月報資料' });

  // 2 檢次
  if (k.bookA) {
    const genText = k.gen1Pct ? ('一代 ' + num(k.bookA[0]) + ' (' + k.gen1Pct + '%)') : ('一代 ' + num(k.bookA[0]));
    const gen2Text = k.gen2Pct ? ('二代 ' + num(k.bookA[1]) + ' (' + k.gen2Pct + '%)') : ('二代 ' + num(k.bookA[1]));
    tiles.push({ label:'預約檢次', val:num(k.bookA[2]), foot:genText + ' · ' + gen2Text });
  } else tiles.push({ label:'預約檢次', val:'—', foot:'沒有已預約統計表' });

  // 3 到檢率
  if (k.bookA && k.bookC) {
    const rate = k.bookA[2] ? k.bookC[2] / k.bookA[2] : 0;
    tiles.push({ label:'到檢率', val:pct0(rate), foot:'已到 ' + num(k.bookC[2]) + ' / 預約 ' + num(k.bookA[2]), cls: rate >= 0.8 ? 'good' : 'warn' });
  } else tiles.push({ label:'到檢率', val:'—', foot:'資料不足' });

  // 4 排檢率警訊
  const wTot = (DB.D.warn && DB.D.warn.totals || []).find(t => String(t[0]).indexOf('臺灣') >= 0);
  if (wTot) {
    const rate = parseFloat(String(wTot[12])) / 100;
    tiles.push({ label:'六週排檢率 <span style="color:var(--ink-3)">全台</span>', val:pct0(rate), foot:'紅燈 <b>' + k.warnRed + '</b> 格 · 黃燈 <b>' + k.warnYellow + '</b> 格', cls: k.warnRed > 8 ? 'bad' : k.warnRed > 0 ? 'warn' : 'good' });
  } else tiles.push({ label:'六週排檢率', val:'—', foot:'沒有警訊表' });

  // 5 未來待檢
  tiles.push({ label:'未來 ' + DB.watchDays + ' 天待檢', val:num(k.watch.n), foot: (k.watch.unpaid ? '<b style="color:var(--red)">' + k.watch.unpaid + ' 筆未繳費</b> · ' : '') + wan(k.watch.amt) });

  // 6 異動（基準不同時不逐筆比，改顯示彙總）
  if (k.delta && k.delta.comparable) {
    const d = k.delta;
    const n = d.added.length + d.removed.length + d.attCh.length + d.payCh.length;
    tiles.push({ label:'上次匯入至今的異動', val:num(n),
      foot:'新增 ' + d.added.length + ' · 取消 ' + d.removed.length + ' · 狀態 ' + (d.attCh.length + d.payCh.length),
      cls: d.removed.length ? 'bad' : n > 0 ? 'warn' : 'good' });
  } else if (k.delta && !k.delta.comparable) {
    const up = k.delta.bizDelta.filter(function (x) { return x.amt > 0; }).length;
    const dn = k.delta.bizDelta.filter(function (x) { return x.amt < 0; }).length;
    tiles.push({ label:'近 7 天新增預約', val:num(k.newWeek),
      foot:'上次基準不同（' + pct0(k.delta.overlap) + ' 重疊）· 業績 ' + up + ' 升 ' + dn + ' 降', cls:'' });
  } else {
    tiles.push({ label:'近 7 天新增預約', val:num(k.newWeek), foot:'昨天 ' + k.newPrev + ' 筆 · 尚無前次快照', cls: k.newWeek ? '' : 'warn' });
  }

  $('#kpis').innerHTML = tiles.map(function (t) {
    return '<div class="kpi ' + (t.cls||'') + '"><div class="k-label">' + t.label + '</div><div class="k-val">' + t.val + '</div><div class="k-foot">' + t.foot + '</div></div>';
  }).join('');
}

/* ---------- 篩選列 ---------- */
function renderFilters() {
  const D = DB.D;
  const bz = $('#fBiz'); const bs = DB.filter.biz;
  bz.innerHTML =
    '<button class="chip" data-act="all-biz" aria-pressed="' + (bs.size === D.biz.length) + '">全部</button>' +
    D.biz.map(function (b, i) {
      const sel = bs.has(i);
      return '<button class="chip" data-biz="' + i + '" aria-pressed="' + sel + '" title="' + esc(b.code) + '">' + esc(b.name) + '<span class="cc">' + esc(b.code) + '</span></button>';
    }).join('');

  const cl = $('#fClinic'); const cs = DB.filter.clinic;
  const cks = clinicKeys();
  cl.innerHTML =
    '<button class="chip" data-act="all-clinic" aria-pressed="' + (cs.size === cks.length && cks.length > 0) + '">全部</button>' +
    cks.map(function (c) {
      return '<button class="chip" data-clinic="' + esc(c.key) + '" aria-pressed="' + cs.has(c.key) + '">' + esc(c.label) + '</button>';
    }).join('');

  const months = [];
  (D.monthly && D.monthly.months || []).forEach(m => { if (months.indexOf(m) < 0) months.push(m); });
  Object.keys((D.booked && D.booked.all) || {}).forEach(m => { if (months.indexOf(m) < 0) months.push(m); });
  if (D.month && months.indexOf(D.month) < 0) months.unshift(D.month);
  months.sort();
  const sel = $('#fMonth');
  sel.innerHTML = months.map(m => '<option value="' + esc(m) + '"' + (m === (DB.filter.month || D.month) ? ' selected' : '') + '>' + esc(m) + '</option>').join('');

  const rows = detailRows();
  $('#railSum').textContent =
    (bs.size ? bs.size + ' 位業務' : '全部業務') + ' · ' +
    (cs.size ? cs.size + ' 間診所' : '全部診所') + ' · ' +
    (DB.filter.month || D.month) + ' · 明細 ' + num(rows.length) + ' 筆';
}

/* ---------- 分頁 ---------- */
const TABS = [
  { id:'perf',  name:'業績' },
  { id:'sched', name:'排檢狀況' },
  { id:'warn',  name:'排檢量警訊' },
  { id:'watch', name:'未來待檢' },
  { id:'delta', name:'異常異動' },
  { id:'commission', name:'業績計算' },
  { id:'data',  name:'明細查詢' },
];
function renderTabs() {
  const k = computeKpis();
  const badge = {
    warn: { n: k.warnRed, cls: k.warnRed ? 'alert' : '' },
    watch: { n: k.watch.n, cls: k.watch.unpaid ? 'caution' : '' },
    delta: (k.delta && k.delta.comparable)
      ? { n: k.delta.added.length + k.delta.removed.length + k.delta.attCh.length + k.delta.payCh.length, cls: k.delta.removed.length ? 'alert' : '' }
      : { n: 0, cls: '' }
  };
  $('#tabs').innerHTML = TABS.map(function (t) {
    const b = badge[t.id];
    const sel = DB.view === t.id;
    return '<button class="tab" role="tab" data-tab="' + t.id + '" aria-selected="' + sel + '">' + esc(t.name) +
      (b && b.n ? '<span class="badge ' + b.cls + '">' + b.n + '</span>' : '') + '</button>';
  }).join('');
}

/* ============================ 業績 ============================ */
function viewPerf() {
  const D = DB.D, mo = DB.filter.month || D.month;
  sortOf('perf.rank', 'rank', 1);
  let h = '';
  if (monthMismatch()) h += notice('<b>明細檔目前只有 ' + esc(D.month) + ' 的資料。</b>你選的是 ' + esc(mo) + '，所以需要明細的區塊會是空的；月報與已預約統計表的數字仍會照月份切換。', 'y');

  const mf = monthlyFor(mo);
  // 左：業務排行
  let left;
  if (mf && mf.rows.length) {
    const base = mf.rows.map(function (r) {
      const hasT = r.target > 0;
      return { name:r.name, code:r.code, target:hasT ? r.target : null, booked:r.booked,
               gap: hasT ? r.target - r.booked : null, rate: hasT ? r.rate : null, noTarget:!hasT };
    });
    const ranked = base.slice().sort(function (a, b) { return ((b.noTarget ? 0 : 1) - (a.noTarget ? 0 : 1)) || ((b.rate || 0) - (a.rate || 0)); });
    ranked.forEach(function (r, i) { r.rank = i + 1; });
    const sorted = sortRows(base, 'perf.rank');
    let body = '<div class="scroll" style="max-height:min(62vh,620px)"><table><thead><tr>' +
      thPlain('', '') + thSort('perf.rank', 'name', '業務') + thSort('perf.rank', 'target', '目標', 'n') +
      thSort('perf.rank', 'booked', '已約', 'n') + thSort('perf.rank', 'gap', '缺口', 'n') +
      thSort('perf.rank', 'rate', '達成率', 'n') + '</tr></thead><tbody>';
    sorted.forEach(function (r) {
      const cls = (r.rate || 0) >= 0.9 ? '' : (r.rate || 0) >= 0.7 ? 'warn' : 'bad';
      const gapCell = r.noTarget ? '<span style="color:var(--ink-3)">—</span>'
        : (r.gap > 0 ? '<span style="color:var(--red)">−' + num(r.gap) + '</span>' : '<span style="color:var(--green)">達標</span>');
      const rateCell = r.noTarget ? '<span style="color:var(--ink-3)">未設目標</span>'
        : '<div class="bar-wrap"><span class="pc">' + pct0(r.rate) + '</span><div class="bar"><i class="' + cls + '" style="width:' + Math.min(100, r.rate * 100) + '%"></i></div></div>';
      body += '<tr><td class="rk num">' + r.rank + '</td>' +
        '<td><div class="who"><span class="nm">' + esc(r.name) + '</span><span class="cd">' + esc(r.code) + '</span></div></td>' +
        '<td class="n">' + (r.noTarget ? '<span style="color:var(--ink-3)">—</span>' : num(r.target)) + '</td><td class="n">' + num(r.booked) + '</td>' +
        '<td class="n">' + gapCell + '</td>' +
        '<td class="n">' + rateCell + '</td></tr>';
    });
    body += '</tbody><tfoot><tr><td></td><td>合計</td><td class="n">' + num(mf.tot.target) + '</td><td class="n">' + num(mf.tot.booked) + '</td><td class="n">' + num(mf.tot.target - mf.tot.booked) + '</td><td class="n"><div class="bar-wrap"><span class="pc">' + pct0(mf.tot.rate) + '</span><div class="bar"><i class="' + (mf.tot.rate >= 0.9 ? '' : mf.tot.rate >= 0.7 ? 'warn' : 'bad') + '" style="width:' + Math.min(100, mf.tot.rate * 100) + '%"></i></div></div></td></tr></tfoot></table></div>';
    CSV_EXPORTS['perf.rank'] = function () {
      return csvOf(['名次','業務','代碼','目標','已約','缺口','達成率'],
        sorted.map(function (r) { return [r.rank, r.name, r.code, r.noTarget ? '' : r.target, r.booked, r.noTarget ? '' : r.gap, r.noTarget ? '' : Math.round((r.rate || 0) * 100) + '%']; }));
    };
    left = panelPad('業績目標與達成率（預排月報 · 個檢 · ' + mo + '）', body, csvBtn('perf.rank'));
  } else left = panelPad('業績目標與達成率', emptyBox('這個月沒有預排月報', '拖入「預排業績月報(個檢)」就會出現。'));

  // 右：結構
  let right = '';
  const rec = D.recon;
  if (rec && rec.all && rec.all.length) {
    let pick = rec.all;
    if (DB.filter.biz.size) {
      pick = rec.all.filter(function (r) {
        const bi = D.biz.findIndex(x => x.code === r.code);
        return bi >= 0 && DB.filter.biz.has(bi);
      });
    }
    if (pick.length) {
      const rev = [0,0,0,0], chk = [0,0,0];
      pick.forEach(r => { r.rev.forEach((v,i)=>rev[i]+=v); r.chk.forEach((v,i)=>chk[i]+=v); });
      right += panel('業績結構（業績核對表）', '營業額 ' + num(rev[3]), stackedBar([
        { label:'全檢', v:rev[0], cls:'brand' }, { label:'加選', v:rev[1], cls:'sky' }, { label:'診所回歸', v:rev[2], cls:'gold' }
      ]) + '<div style="margin-top:10px" class="legend"><span>一代檢次 <b>' + num(chk[0]) + '</b></span><span>二代檢次 <b>' + num(chk[1]) + '</b></span><span>檢次合計 <b>' + num(chk[2]) + '</b></span></div>');
    }
  }
  if (rec && rec.byClinic && rec.byClinic.length) {
    const agg = {};
    rec.byClinic.forEach(function (r) {
      const bi = D.biz.findIndex(x => x.code === r.code);
      if (DB.filter.biz.size && !(bi >= 0 && DB.filter.biz.has(bi))) return;
      const c = r.cl || '—';
      if (!agg[c]) agg[c] = [0,0,0,0];
      r.rev.forEach((v,i) => agg[c][i] += v);
    });
    const keys = Object.keys(agg).sort();
    let body = '<table><thead><tr><th>診所</th><th class="n">全檢</th><th class="n">加選</th><th class="n">診所回歸</th><th class="n">總計</th></tr></thead><tbody>';
    let t = [0,0,0,0];
    keys.forEach(function (c) {
      const v = agg[c];
      body += '<tr><td><b>' + esc(clName(c)) + '</b></td><td class="n">' + num(v[0]) + '</td><td class="n">' + num(v[1]) + '</td><td class="n">' + num(v[2]) + '</td><td class="n"><b>' + num(v[3]) + '</b></td></tr>';
      v.forEach((x,i) => t[i] += x);
    });
    body += '</tbody><tfoot><tr><td>合計</td><td class="n">' + num(t[0]) + '</td><td class="n">' + num(t[1]) + '</td><td class="n">' + num(t[2]) + '</td><td class="n">' + num(t[3]) + '</td></tr></tfoot></table>';
    right += panelPad('診所別營業額', body);
  }
  // 明細檔的類別結構
  const rows = detailRows().filter(isBooked);
  if (rows.length) {
    const agg = {};
    rows.forEach(function (r) { const c = dict('cat', r[C.cat]) || '—'; agg[c] = (agg[c] || 0) + r[C.amt]; });
    const list = Object.keys(agg).map(k => ({ k:k, v:agg[k] })).sort((a,b) => b.v - a.v);
    let body = '<table><thead><tr><th>類別</th><th class="n">業績</th><th class="n">占比</th></tr></thead><tbody>';
    const tot = list.reduce((a,x) => a + x.v, 0) || 1;
    list.forEach(function (x) {
      body += '<tr><td>' + esc(x.k) + '</td><td class="n">' + num(x.v) + '</td><td class="n">' + pc(x.v / tot) + '</td></tr>';
    });
    body += '</tbody></table>';
    right += panelPad('類別業績（預約明細）', '<div class="scroll" style="max-height:300px">' + body + '</div>');
  }
  if (!right) right = panelPad('業績結構', emptyBox('沒有核對表資料', '拖入「生技客服業績核對表」就會出現。'));

  h += '<div class="split" style="margin-top:0">' + left + '<div class="stack">' + right + '</div></div>';

  // 三個月走勢 + 66 專案
  const mm = D.monthly;
  if (mm && mm.months.length) {
    const bizs = D.biz.filter(function (b, i) { return !DB.filter.biz.size || DB.filter.biz.has(i); });
    const items = mm.months.map(function (mo2, mi) {
      const segs = bizs.map(function (b, bi) {
        const row = mm.rows.find(r => r.code === b.code && !r.tot);
        const v = row ? row.v[mi][1] : 0;
        return { v:v, cls: ['brand','sky','gold','green','amber','line-2'][bi % 6], title:b.name + ' ' + num(v) };
      });
      let tt = 0; segs.forEach(s => tt += s.v);
      return { label: mo2.slice(5) + '月', sub: wan(tt), segs: segs };
    });
    let legend = '<div class="legend">' + bizs.map(function (b, bi) {
      return '<span><i style="background:var(--' + ['brand','sky','gold','green','amber','line-2'][bi % 6] + ')"></i>' + esc(b.name) + '</span>';
    }).join('') + '</div>';
    h += '<div class="stack" style="margin-top:12px">' + panel('各月已約業績走勢', '依業務堆疊', vbars(items, { height:170, col:64 }) + legend) + '</div>';
  }
  if (D.recon && D.recon.proj66 && D.recon.proj66.length) {
    const cl = ['04','43','97'];
    let body = '<div class="scroll" style="max-height:340px"><table><thead><tr><th>業務</th>' +
      cl.map(c => '<th class="n">' + esc(clName(c)) + ' 業績</th><th class="n">獎金加碼</th>').join('') +
      '<th class="n">業績合計</th><th class="n">獎金合計</th></tr></thead><tbody>';
    const t = [0,0,0,0,0,0,0,0];
    D.recon.proj66.forEach(function (r) {
      const bi = D.biz.findIndex(x => x.code === r.code);
      if (DB.filter.biz.size && !(bi >= 0 && DB.filter.biz.has(bi))) return;
      body += '<tr><td>' + esc(r.name) + '</td>';
      for (let i = 0; i < 8; i++) { body += '<td class="n">' + (r.cells[i] ? num(r.cells[i]) : '—') + '</td>'; t[i] += r.cells[i]; }
      body += '</tr>';
    });
    body += '</tbody><tfoot><tr><td>合計</td>' + t.map((v,i) => '<td class="n">' + (v ? num(v) : '—') + '</td>').join('') + '</tr></tfoot></table></div>';
    h += '<div class="stack" style="margin-top:12px">' + panelPad('66 專案 — 首次全檢（業績與獎金加碼）', body) + '</div>';
  }
  return h;
}

function viewSched() {
  const D = DB.D, mo = DB.filter.month || D.month, today = todayISO();

  const A = bookedFor(mo, 'A:預約', '全'), B = bookedFor(mo, 'B:繳費', '全'), C = bookedFor(mo, 'C:到撿', '全');

    const stat = {};
    (C && C.rows || []).forEach(r => { if (!stat[r.code]) stat[r.code] = { att:0, attRev:0 }; stat[r.code].att = r.v[2]; stat[r.code].attRev = r.v[6]; });
    (B && B.rows || []).forEach(r => { if (!stat[r.code]) stat[r.code] = {}; stat[r.code].paid = r.v[2]; stat[r.code].paidRev = r.v[6]; });

      return { name:r.name, code:r.code, g1:r.v[0], g2:r.v[1], cnt:r.v[2], r1:r.v[3], r2:r.v[4], radd:r.v[5], rtot:r.v[6],

      thSort('sched.main', 'cnt', '檢次', 'n') + thSort('sched.main', 'r1', '營收一代', 'n') + thSort('sched.main', 'r2', '營收二代', 'n') +
      thSort('sched.main', 'radd', '營收加選', 'n') + thSort('sched.main', 'rtot', '營收合計', 'n') +
